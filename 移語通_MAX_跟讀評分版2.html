<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>移語通 MAX | 旗艦完整版</title>
    <meta name="theme-color" content="#0d9488">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="./app-icon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media',
            theme: { extend: { boxShadow: { 'top': '0 -4px 6px -1px rgba(0, 0, 0, 0.1)' } } }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; user-select: none; }
        .app-shell { max-width: 440px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; position: relative; overflow-x: hidden; }
        
        .lang-chip { opacity: 0.6; filter: grayscale(50%); transform: scale(0.95); transition: all 0.2s ease; }
        .lang-chip.active { opacity: 1; filter: grayscale(0%); transform: scale(1); background-color: #0d9488; color: white; border-color: #0d9488; font-weight: 800; box-shadow: 0 4px 12px rgba(13, 148, 136, 0.3); }
        
        .dict-pill, .sent-pill { transition: all 0.2s; }
        .dict-pill.active, .sent-pill.active { background-color: #0f766e; color: white; border-color: #0f766e; }
        
        .nav-item.active { color: #0d9488; font-weight: 800; }
        .dark .nav-item.active { color: #2dd4bf; }
        .nav-item.active i { transform: translateY(-2px); }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .perspective-1000 { perspective: 1000px; }
        .flip-card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
        .flip-card-inner.flipped { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
        .flip-card-back { transform: rotateY(180deg); }
        @keyframes mic-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.5); } 50% { box-shadow: 0 0 0 14px rgba(225, 29, 72, 0); } }
        .mic-listening { animation: mic-pulse 1.4s infinite; background-color: #e11d48 !important; color: #ffffff !important; border-color: #e11d48 !important; }
        .sp-ok { color: #059669; }
        .sp-near { color: #d97706; border-bottom: 2px dotted #d97706; }
        .sp-miss { color: #e11d48; border-bottom: 2px solid #e11d48; }
        .sp-pun { opacity: .55; }
        .sp-v-good { color: #059669; } .sp-v-close { color: #d97706; } .sp-v-retry { color: #e11d48; }
        @media (prefers-color-scheme: dark) {
            .sp-ok, .sp-v-good { color: #34d399; } .sp-near, .sp-v-close { color: #fbbf24; } .sp-near { border-color: #fbbf24; }
            .sp-miss, .sp-v-retry { color: #fb7185; } .sp-miss { border-color: #fb7185; }
        }
        #modal-speech-box .sp-ok, #modal-speech-box .sp-v-good { color: #6ee7b7; }
        #modal-speech-box .sp-near, #modal-speech-box .sp-v-close { color: #fcd34d; border-color: #fcd34d; }
        #modal-speech-box .sp-miss, #modal-speech-box .sp-v-retry { color: #fda4af; border-color: #fda4af; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-slate-900 text-slate-900 dark:text-gray-100">

<div class="app-shell bg-white dark:bg-slate-950 shadow-2xl">
    
    <!-- 頂部 Header -->
    <header class="bg-white dark:bg-slate-900 pt-4 pb-3 px-4 sticky top-0 z-30 border-b border-gray-200 dark:border-slate-800">
        <h1 class="text-lg font-black tracking-wide mb-3 flex items-center justify-between">
            <div>移語通 <span class="text-xs bg-teal-600 text-white px-2 py-0.5 rounded-full font-bold ml-1">MAX</span></div>
            <div id="app-tagline" class="text-[11px] text-gray-500 font-normal">台灣移工專用雙向辭典</div>
        </h1>
        <div class="grid grid-cols-4 gap-2 text-sm">
            <button onclick="setLang('id')" id="btn-id" class="lang-chip min-h-[48px] rounded-xl border-2 border-gray-200 flex flex-col items-center justify-center">
                <span class="text-lg mb-0.5">🇮🇩</span><span class="text-[10px]">Indo</span>
            </button>
            <button onclick="setLang('vi')" id="btn-vi" class="lang-chip min-h-[48px] rounded-xl border-2 border-gray-200 flex flex-col items-center justify-center">
                <span class="text-lg mb-0.5">🇻🇳</span><span class="text-[10px]">Việt</span>
            </button>
            <button onclick="setLang('th')" id="btn-th" class="lang-chip min-h-[48px] rounded-xl border-2 border-gray-200 flex flex-col items-center justify-center">
                <span class="text-lg mb-0.5">🇹🇭</span><span class="text-[10px]">ไทย</span>
            </button>
            <button onclick="setLang('tl')" id="btn-tl" class="lang-chip min-h-[48px] rounded-xl border-2 border-gray-200 flex flex-col items-center justify-center">
                <span class="text-lg mb-0.5">🇵🇭</span><span class="text-[10px]">Tagalog</span>
            </button>
        </div>
        <button onclick="openFavorites()" class="mt-3 w-full min-h-[40px] rounded-xl border border-amber-200 dark:border-amber-800 bg-amber-50 dark:bg-amber-950/30 px-3 text-sm font-bold text-amber-800 dark:text-amber-300 flex items-center justify-center gap-2">
            <i class="fa-solid fa-star text-amber-500"></i><span id="favorites-button-label">我的收藏</span><span id="favorites-count" class="rounded-full bg-amber-200 dark:bg-amber-900 px-2 py-0.5 text-xs">0</span>
        </button>
        <p id="offline-status" role="status" aria-live="polite" class="hidden mt-2 rounded-lg bg-teal-50 dark:bg-teal-950/40 px-3 py-2 text-[11px] leading-relaxed text-teal-800 dark:text-teal-200"></p>
    </header>

    <main class="flex-1 overflow-y-auto pb-24 bg-gray-50 dark:bg-slate-900">

        <!-- ==================== 1. 單字庫 ==================== -->
        <section id="view-dict" class="space-y-3">
            <div class="sticky top-0 bg-gray-50 dark:bg-slate-900 px-4 py-3 z-20 space-y-3 border-b border-gray-200 dark:border-slate-800">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-gray-400"></i>
                    <input type="text" id="dict-search" oninput="resetAndRenderDict()" placeholder="搜尋中文、拼音或母語..." class="w-full min-h-[44px] pl-10 pr-10 bg-white dark:bg-slate-800 border border-gray-300 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:border-teal-500 shadow-sm">
                    <button onclick="clearSearch()" id="clear-search-btn" class="hidden absolute right-3 top-2.5 w-7 h-7 rounded-full bg-gray-200 dark:bg-slate-700 text-gray-600 dark:text-gray-300 text-xs flex items-center justify-center">✕</button>
                </div>
                <div class="flex gap-2 overflow-x-auto pb-1 text-xs no-scrollbar">
                    <button onclick="setDictCat('all')" id="dcat-all" class="dict-pill active min-h-[40px] px-4 rounded-full border border-gray-300 dark:border-slate-700 bg-white dark:bg-slate-800 font-bold shrink-0"><span id="dict-label-all">全部</span> (<span id="c-all">0</span>)</button>
                    <button onclick="setDictCat('life')" id="dcat-life" class="dict-pill min-h-[40px] px-4 rounded-full border border-gray-300 dark:border-slate-700 bg-white dark:bg-slate-800 font-bold shrink-0">🛵 <span id="dict-label-life">日常生活</span> (<span id="c-life">0</span>)</button>
                    <button onclick="setDictCat('work')" id="dcat-work" class="dict-pill min-h-[40px] px-4 rounded-full border border-gray-300 dark:border-slate-700 bg-white dark:bg-slate-800 font-bold shrink-0">👷‍♂️ <span id="dict-label-work">工廠職場</span> (<span id="c-work">0</span>)</button>
                    <button onclick="setDictCat('const')" id="dcat-const" class="dict-pill min-h-[40px] px-4 rounded-full border border-gray-300 dark:border-slate-700 bg-white dark:bg-slate-800 font-bold shrink-0">🏗️ <span id="dict-label-const">營造工程</span> (<span id="c-const">0</span>)</button>
                    <button onclick="setDictCat('health')" id="dcat-health" class="dict-pill min-h-[40px] px-4 rounded-full border border-gray-300 dark:border-slate-700 bg-white dark:bg-slate-800 font-bold shrink-0">🏥 <span id="dict-label-health">醫療照護</span> (<span id="c-health">0</span>)</button>
                    <button onclick="setDictCat('travel')" id="dcat-travel" class="dict-pill min-h-[40px] px-4 rounded-full border border-gray-300 dark:border-slate-700 bg-white dark:bg-slate-800 font-bold shrink-0">🚌 <span id="dict-label-travel">交通外出</span> (<span id="c-travel">0</span>)</button>
                    <button onclick="setDictCat('law')" id="dcat-law" class="dict-pill min-h-[40px] px-4 rounded-full border border-gray-300 dark:border-slate-700 bg-white dark:bg-slate-800 font-bold shrink-0">⚖️ <span id="dict-label-law">法令權益</span> (<span id="c-law">0</span>)</button>
                </div>
            </div>
            <div id="dict-list" class="flex flex-col divide-y divide-gray-100 dark:divide-slate-800"></div>
            <div id="load-more-container" class="p-4 text-center hidden">
                <button onclick="loadMore()" class="w-full min-h-[48px] bg-white dark:bg-slate-800 border border-gray-300 dark:border-slate-700 rounded-xl font-bold text-gray-700 dark:text-gray-200 shadow-sm active:bg-gray-100" id="load-more-label">顯示更多</button>
            </div>
        </section>

        <!-- ==================== 2. 實用句型庫 ==================== -->
        <section id="view-learn" class="hidden flex-col">
            <div class="sticky top-0 bg-gray-50 dark:bg-slate-900 px-4 py-3 z-20 border-b border-gray-200 dark:border-slate-800 shadow-sm">
                <div class="flex gap-2 overflow-x-auto pb-1 text-xs no-scrollbar" id="sentence-categories"></div>
            </div>
            <div id="card-container" class="space-y-3 p-4"></div>
        </section>

                <!-- ==================== 5. 實用語法 ==================== -->
        <section id="view-grammar" class="hidden flex-col">
            <div class="sticky top-0 bg-gray-50 dark:bg-slate-900 px-4 py-3 z-20 border-b border-gray-200 dark:border-slate-800 shadow-sm">
                <div id="grammar-categories" class="flex gap-2 overflow-x-auto pb-1 text-xs no-scrollbar"></div>
            </div>
            <div id="grammar-card-container" class="space-y-4 p-4"></div>
        </section>

        <!-- ==================== 3. 互動練習模組 ==================== -->
        <section id="view-ai" class="p-4 hidden flex-col space-y-4">
            <div id="ai-menu" class="space-y-3">
                <h2 id="game-menu-title" class="font-black text-lg text-slate-800 dark:text-slate-200 mb-3 px-1">選擇練習模式</h2>
                <button onclick="openGame('quiz')" class="w-full flex items-center bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-gray-200 dark:border-slate-700 active:bg-gray-50 transition">
                    <div class="w-12 h-12 rounded-full bg-teal-100 dark:bg-teal-900/60 text-teal-600 flex items-center justify-center text-xl shrink-0">🎧</div>
                    <div class="text-left ml-4"><div id="game-quiz-title" class="font-bold text-gray-900 dark:text-white">單字聽力測驗</div><div id="game-quiz-subtitle" class="text-xs text-gray-500 mt-1">Kuis Mendengarkan Kata</div></div>
                </button>
                <button onclick="openGame('fill')" class="w-full flex items-center bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-gray-200 dark:border-slate-700 active:bg-gray-50 transition">
                    <div class="w-12 h-12 rounded-full bg-blue-100 dark:bg-blue-900/60 text-blue-600 flex items-center justify-center text-xl shrink-0">🧩</div>
                    <div class="text-left ml-4"><div id="game-fill-title" class="font-bold text-gray-900 dark:text-white">實用句型填空</div><div id="game-fill-subtitle" class="text-xs text-gray-500 mt-1">Isi Bagian yang Kosong</div></div>
                </button>
                <button onclick="openGame('build')" class="w-full flex items-center bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-gray-200 dark:border-slate-700 active:bg-gray-50 transition">
                    <div class="w-12 h-12 rounded-full bg-amber-100 dark:bg-amber-900/60 text-amber-600 flex items-center justify-center text-xl shrink-0">🧱</div>
                    <div class="text-left ml-4"><div id="game-build-title" class="font-bold text-gray-900 dark:text-white">聽音拼句練習</div><div id="game-build-subtitle" class="text-xs text-gray-500 mt-1">Menyusun Kalimat</div></div>
                </button>
                <button onclick="openGame('scenario')" class="w-full flex items-center bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-gray-200 dark:border-slate-700 active:bg-gray-50 transition">
                    <div class="w-12 h-12 rounded-full bg-rose-100 dark:bg-rose-900/60 text-rose-600 flex items-center justify-center text-xl shrink-0">💬</div>
                    <div class="text-left ml-4"><div id="game-scenario-title" class="font-bold text-gray-900 dark:text-white">職場情境對答</div><div id="game-scenario-subtitle" class="text-xs text-gray-500 mt-1">Tanya Jawab Situasi Kerja</div></div>
                </button>
                <button onclick="openGame('reply')" class="w-full flex items-center bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-gray-200 dark:border-slate-700 active:bg-gray-50 transition">
                    <div class="w-12 h-12 rounded-full bg-purple-100 dark:bg-purple-900/60 text-purple-600 flex items-center justify-center text-xl shrink-0">🗣️</div>
                    <div class="text-left ml-4"><div id="game-reply-title" class="font-bold text-gray-900 dark:text-white">聽台灣人說話，選合理回覆</div><div id="game-reply-subtitle" class="text-xs text-gray-500 mt-1">Listen and choose a suitable reply</div></div>
                </button>
                <button onclick="openGame('speak')" class="w-full flex items-center bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-gray-200 dark:border-slate-700 active:bg-gray-50 transition">
                    <div class="w-12 h-12 rounded-full bg-emerald-100 dark:bg-emerald-900/60 text-emerald-600 flex items-center justify-center text-xl shrink-0">🎙️</div>
                    <div class="text-left ml-4"><div id="game-speak-title" class="font-bold text-gray-900 dark:text-white">口說發音練習</div><div id="game-speak-subtitle" class="text-xs text-gray-500 mt-1">Latihan Pengucapan & Penilaian Bintang</div></div>
                </button>
                <button onclick="openGame('tinder')" class="w-full flex items-center bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-gray-200 dark:border-slate-700 active:bg-gray-50 transition">
                    <div class="w-12 h-12 rounded-full bg-pink-100 dark:bg-pink-900/60 text-pink-600 flex items-center justify-center text-xl shrink-0">🃏</div>
                    <div class="text-left ml-4"><div id="game-tinder-title" class="font-bold text-gray-900 dark:text-white">權益快問快答</div><div id="game-tinder-subtitle" class="text-xs text-gray-500 mt-1">Hukum atau Ilegal? (Geser Kanan/Kiri)</div></div>
                </button>
            </div>
            <div id="game-back-btn" class="hidden">
                <button onclick="backToAiMenu()" id="game-back-label" class="text-teal-600 dark:text-teal-400 font-bold text-sm bg-white dark:bg-slate-800 px-4 py-2 rounded-xl shadow-sm border border-gray-200 dark:border-slate-700 active:scale-95 transition"><i class="fa-solid fa-arrow-left mr-2"></i>返回選單</button>
            </div>
            <div id="game-quiz" class="hidden space-y-4">
                <div class="bg-teal-50 border border-teal-200 rounded-2xl p-5 text-center dark:bg-teal-900/30 dark:border-teal-800 mt-2">
                    <h2 id="quiz-title" class="font-black text-lg text-teal-800 dark:text-teal-200 mb-2">單字聽力小測驗</h2>
                    <p id="quiz-description" class="text-xs text-teal-600 dark:text-teal-400 mb-4">系統會隨機發音一個單字，請選出正確的意思。</p>
                    <button id="quiz-start" onclick="startSimpleQuiz()" class="min-h-[44px] px-6 bg-teal-600 text-white rounded-xl font-bold shadow-md active:bg-teal-700">開始練習</button>
                </div>
                <div id="quiz-area" class="hidden space-y-3">
                    <div class="text-center py-6 bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-gray-200 dark:border-slate-700">
                        <button onclick="speakQuizWord()" class="w-16 h-16 bg-teal-100 dark:bg-teal-900/60 text-teal-600 dark:text-teal-300 rounded-full text-2xl mb-3 shadow-sm active:scale-95 transition"><i class="fa-solid fa-volume-high"></i></button>
                        <div id="quiz-zh-hint" onclick="this.classList.remove('blur-sm')" class="text-xl font-black mb-1 blur-sm hover:blur-none cursor-pointer select-none">點擊偷看中文</div>
                        <div id="quiz-py-hint" class="text-xs text-gray-400">點擊上方文字可顯示中文提示</div>
                    </div>
                    <div id="quiz-options" class="grid gap-2"></div>
                    <div id="quiz-feedback" class="hidden p-3 rounded-xl text-center text-sm font-bold"></div>
                </div>
            </div>
            <div id="game-fill" class="hidden space-y-4 mt-2">
                <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-gray-200 dark:border-slate-700 p-5 text-center">
                    <button onclick="speakFillQuestion()" class="w-14 h-14 bg-blue-100 text-blue-600 rounded-full text-xl mb-4 shadow-sm active:scale-95 transition"><i class="fa-solid fa-volume-high"></i></button>
                    <div id="fill-sentence" class="text-2xl font-black text-gray-900 dark:text-white mb-2 leading-relaxed"></div>
                    <div id="fill-py" class="text-xs text-gray-500 mb-4 font-medium"></div>
                    <div id="fill-lang" class="text-sm font-bold text-blue-800 bg-blue-50 p-3 rounded-xl border border-blue-100"></div>
                </div>
                <div id="fill-options" class="grid grid-cols-2 gap-3"></div>
                <div id="fill-feedback" class="hidden p-3 rounded-xl text-center text-sm font-bold"></div>
                <button onclick="nextFillGame()" class="w-full min-h-[48px] bg-blue-600 text-white rounded-xl font-bold mt-2 shadow-md hidden" id="fill-next-btn">下一題 <i class="fa-solid fa-arrow-right ml-1"></i></button>
            </div>
            <div id="game-build" class="hidden space-y-4 mt-2">
                <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-gray-200 dark:border-slate-700 p-5 text-center">
                    <button onclick="speakBuildQuestion()" class="w-14 h-14 bg-amber-100 text-amber-600 rounded-full text-xl mb-4 shadow-sm active:scale-95 transition"><i class="fa-solid fa-volume-high"></i></button>
                    <div id="build-answer-area" class="min-h-[56px] flex flex-wrap justify-center gap-2 mb-4 p-2 bg-gray-50 dark:bg-slate-900 rounded-xl border border-dashed border-gray-300"></div>
                    <div id="build-lang" class="text-sm font-bold text-amber-800 bg-amber-50 p-3 rounded-xl border border-amber-100"></div>
                </div>
                <div id="build-blocks-area" class="flex flex-wrap justify-center gap-3 mt-4"></div>
                <div id="build-feedback" class="hidden p-3 rounded-xl text-center text-sm font-bold"></div>
                <button onclick="nextBuildGame()" class="w-full min-h-[48px] bg-amber-500 text-white rounded-xl font-bold mt-2 shadow-md hidden" id="build-next-btn">下一題 <i class="fa-solid fa-arrow-right ml-1"></i></button>
            </div>
            <div id="game-scenario" class="hidden space-y-4 mt-2">
                <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-gray-200 dark:border-slate-700 p-5">
                    <div class="flex items-start gap-3 mb-4">
                        <div class="w-10 h-10 rounded-full bg-rose-100 flex items-center justify-center text-rose-600 text-lg shrink-0">👤</div>
                        <div class="bg-gray-50 dark:bg-slate-900 p-3 rounded-2xl rounded-tl-none border border-gray-200 dark:border-slate-700 relative">
                            <button onclick="speakScenarioQuestion()" class="absolute -right-2 -bottom-2 w-8 h-8 bg-rose-500 text-white rounded-full text-xs shadow-md"><i class="fa-solid fa-volume-high"></i></button>
                            <div id="scenario-zh" class="font-black text-gray-900 dark:text-white text-lg mb-1"></div>
                            <div id="scenario-py" class="text-[10px] text-gray-400 mb-2"></div>
                            <div id="scenario-lang" class="text-xs font-bold text-rose-700"></div>
                        </div>
                    </div>
                </div>
                <div id="scenario-options" class="space-y-3"></div>
                <div id="scenario-feedback" class="hidden p-3 rounded-xl text-center text-sm font-bold"></div>
                <button onclick="nextScenarioGame()" class="w-full min-h-[48px] bg-rose-600 text-white rounded-xl font-bold mt-2 shadow-md hidden" id="scenario-next-btn">下一題 <i class="fa-solid fa-arrow-right ml-1"></i></button>
            </div>
            <div id="game-reply" class="hidden space-y-4 mt-2">
                <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-gray-200 dark:border-slate-700 p-5">
                    <p id="reply-instructions" class="text-sm font-bold text-purple-800 dark:text-purple-200 mb-4"></p>
                    <div class="bg-purple-50 dark:bg-purple-950/40 border border-purple-200 dark:border-purple-800 rounded-2xl p-4 relative">
                        <button onclick="speakReplyPrompt()" aria-label="播放台灣人說的話" class="absolute right-3 top-3 w-10 h-10 bg-purple-600 text-white rounded-full shadow-md active:scale-95"><i class="fa-solid fa-volume-high"></i></button>
                        <div class="text-xs font-bold text-purple-700 dark:text-purple-300 mb-2">🇹🇼</div>
                        <div id="reply-prompt-zh" class="font-black text-gray-900 dark:text-white text-lg pr-12 mb-1"></div>

    // 去除拼音聲調符號，方便無聲調搜尋 (例如輸入 ni hao 可搜到 nǐ hǎo)
    function normalizePinyin(str) {
        return (str || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    }

    function parseRawData() {
        const knownVocabulary = new Set();

        // 1. 解析旗艦版 10 大分類詞庫 (格式: zh | py | id | vi | th | tl)
        let curSectionCat = 'life';
        rawFlagshipData.split('\n').forEach(line => {
            const t = line.replace(/[\u200b]/g, '').trim();
            if (!t) return;
            if (t.startsWith('#')) {
                if (t.includes('一、') || t.includes('二、') || t.includes('七、') || t.includes('十、')) curSectionCat = 'life';
                else if (t.includes('三、') || t.includes('四、')) curSectionCat = 'health';
                else if (t.includes('五、')) curSectionCat = 'work';
                else if (t.includes('六、')) curSectionCat = 'const';
                else if (t.includes('八、')) curSectionCat = 'travel';
                else if (t.includes('九、')) curSectionCat = 'law';
                return;
            }
            const parts = t.split('|').map(s => s.trim());
            if (parts.length >= 6 && !knownVocabulary.has(parts[0])) {
                knownVocabulary.add(parts[0]);
                masterVocab.push({
                    idx: masterVocab.length,
                    cat: curSectionCat,
                    zh: parts[0],
                    py: parts[1],
                    pyPlain: normalizePinyin(parts[1]),
                    id: parts[2],
                    vi: parts[3],
                    th: parts[4],
                    tl: parts[5]
                });
            }
        });

        // 2. 解析 200 個常用核心單詞 (格式: 編號. zh | py | vi | id | tl | th)
        rawCore200Data.split('\n').forEach(line => {
            const t = line.replace(/[\u200b]/g, '').trim();
            if (!t || t.startsWith('#') || t.startsWith('[') || t.startsWith('=')) return;
            const parts = t.split('|').map(s => s.trim());
            if (parts.length >= 6) {
                const numMatch = parts[0].match(/^(\d+)\.\s*(.+)$/);
                const idNum = numMatch ? parseInt(numMatch[1], 10) : 1;
                const zhText = numMatch ? numMatch[2].trim() : parts[0];
                if (knownVocabulary.has(zhText)) return;
                knownVocabulary.add(zhText);

                let cCat = 'life';
                if (idNum >= 51 && idNum <= 90) cCat = 'work';
                else if (idNum >= 91 && idNum <= 120) cCat = 'health';
                else if (idNum >= 121 && idNum <= 150) cCat = 'travel';

                masterVocab.push({
                    idx: masterVocab.length,
                    cat: cCat,
                    zh: zhText,
                    py: parts[1],
                    pyPlain: normalizePinyin(parts[1]),
                    vi: parts[2],
                    id: parts[3],
                    tl: parts[4],
                    th: parts[5]
                });
            }
        });

        // 3. 解析補充詞彙，略過已存在的中文詞條以避免重複
        rawAdditionalVocabData.split('\n').forEach(line => {
            const t = line.replace(/[\u200b]/g, '').trim();
            if (!t || t.startsWith('#')) return;
            const parts = t.split('|').map(s => s.trim());
            if (parts.length < 7) return;
            const [cat, zh, py, id, vi, th, tl] = parts;
            if (!zh || knownVocabulary.has(zh)) return;
            knownVocabulary.add(zh);
            masterVocab.push({
                idx: masterVocab.length,
                cat,
                zh,
                py,
                pyPlain: normalizePinyin(py),
                id,
                vi,
                th,
                tl
            });
        });

        // 4. 解析 100 句實用句型 (格式: 編號. zh | py | vi | id | tl | th [cat:xxx])
        rawSentencesString.split('\n').forEach(line => {
            const t = line.replace(/[\u200b]/g, '').trim();
            if (!t || t.startsWith('#')) return;
            const matchCat = t.match(/\[cat:([a-z]+)\]$/);
            let sCat = 'social';
            let cleanLine = t;
            if (matchCat) {
                sCat = matchCat[1];
                cleanLine = t.replace(/\[cat:[a-z]+\]$/, '').trim();
            }

            const parts = cleanLine.split('|').map(s => s.trim());
            if (parts.length >= 6 && [2, 3, 4, 5].every(index => parts[index])) {
                const zhText = parts[0].replace(/^\d+\.\s*/, '').trim();
                sentencesData.push({
                    idx: sentencesData.length,
                    cat: sCat,
                    zh: zhText,
                    py: parts[1],
                    vi: parts[2],
                    id: parts[3],
                    tl: parts[4],
                    th: parts[5]
                });
            }
        });

        updateCategoryCounts();
        renderSentenceCategories();
        renderGrammarCategories();
    }

        {"country":"tw","icon":"🥮","zhTitle":"中秋節","period":{"id":"農曆八月十五 (September)","vi":"農曆八月十五 (September)","th":"農曆八月十五 (September)","tl":"農曆八月十五 (September)"},"title":{"id":"Festival Pertengahan Musim Gugur","vi":"Tết Trung Thu","th":"เทศกาลไหว้พระจันทร์","tl":"Mid-Autumn Festival"},"content":{"id":"Libur 1 hari. Merayakan bulan purnama. Orang Taiwan suka BBQ bersama. Bos biasanya memberikan \u0027Kue Bulan\u0027 atau jeruk bali.","vi":"Nghỉ 1 ngày. Kỷ niệm ngày trăng tròn. Người Đài Loan thích tụ tập nướng thịt BBQ. Sếp thường tặng \u0027Bánh Trung Thu\u0027 hoặc bưởi.","th":"หยุด 1 วัน ฉลองพระจันทร์เต็มดวง คนไต้หวันชอบปิ้งย่าง BBQ เจ้านายมักแจก \u0027ขนมไหว้พระจันทร์\u0027 หรือส้มโอ","tl":"Walang pasok. Pagdiriwang ng full moon. Mahilig mag-BBQ ang mga Taiwanese. Madalas mamigay ang amo ng \u0027Mooncake\u0027 o pomelo."},"greeting":{"zh":"中秋節快樂！","id":"中秋節快樂！","vi":"中秋節快樂！","th":"中秋節快樂！","tl":"中秋節快樂！"}},
        {"country":"tw","icon":"🎆","zhTitle":"國慶日 (雙十節)","period":{"id":"10月10日 (Oktober)","vi":"10月10日 (Oktober)","th":"10月10日 (Oktober)","tl":"10月10日 (Oktober)"},"title":{"id":"Hari Nasional (Double Tenth)","vi":"Quốc khánh (Song Thập)","th":"วันชาติไต้หวัน (10 ตุลา)","tl":"Double Tenth Day"},"content":{"id":"Libur 1 hari. Hari Nasional Taiwan. Banyak bendera di jalan dan ada pertunjukan kembang api skala besar di malam hari.","vi":"Nghỉ 1 ngày. Quốc khánh Đài Loan. Treo cờ khắp nơi và thường có bắn pháo hoa lớn vào buổi tối.","th":"หยุด 1 วัน วันชาติไต้หวัน มีการประดับธงชาติและจุดพลุฉลองอย่างยิ่งใหญ่ในตอนกลางคืน","tl":"Walang pasok. National Day ng Taiwan. Maraming watawat at may malaking fireworks display sa gabi."},"greeting":{"zh":"雙十節快樂！","id":"雙十節快樂！","vi":"雙十節快樂！","th":"雙十節快樂！","tl":"雙十節快樂！"}},
        {"country":"tw","icon":"🌀","zhTitle":"颱風假 (防災假)","period":{"id":"夏季至秋季 (Juli-Okt)","vi":"夏季至秋季 (Juli-Okt)","th":"夏季至秋季 (Juli-Okt)","tl":"夏季至秋季 (Juli-Okt)"},"title":{"id":"Libur Topan (Aturan Khusus)","vi":"Nghỉ bão (Quy định đặc biệt)","th":"วันหยุดพายุไต้ฝุ่น","tl":"Typhoon Day (Special Rule)"},"content":{"id":"Saat ada peringatan topan, aturan masuk kerja dapat bergantung pada pengumuman pemerintah setempat dan jenis pekerjaan. Periksa informasi resmi, tanyakan kepada pemberi kerja, dan hubungi 1955 jika hak Anda tidak jelas.","vi":"Khi có cảnh báo bão, việc đi làm có thể tùy thuộc vào thông báo của chính quyền địa phương và loại công việc. Hãy xem thông tin chính thức, hỏi người sử dụng lao động và gọi 1955 nếu chưa rõ quyền lợi.","th":"เมื่อมีประกาศเตือนภัยไต้ฝุ่น การไปทำงานอาจขึ้นอยู่กับประกาศของหน่วยงานท้องถิ่นและประเภทงาน โปรดตรวจสอบข้อมูลทางการ สอบถามนายจ้าง และโทร 1955 หากไม่แน่ใจเรื่องสิทธิ","tl":"Kapag may babala ng bagyo, maaaring mag-iba ang patakaran sa pagpasok ayon sa anunsyo ng lokal na pamahalaan at uri ng trabaho. Tingnan ang opisyal na impormasyon, magtanong sa employer, at tumawag sa 1955 kung hindi malinaw ang iyong mga karapatan."},"greeting":{"zh":"風大雨大，注意安全！","id":"風大雨大，注意安全！","vi":"風大雨大，注意安全！","th":"風大雨大，注意安全！","tl":"風大雨大，注意安全！"}},
        {"country":"id","icon":"🕌","zhTitle":"開齋節 (印尼新年)","period":{"id":"Syawal (Kalender Islam)","vi":"Syawal (Kalender Islam)","th":"Syawal (Kalender Islam)","tl":"Syawal (Kalender Islam)"},"title":{"id":"Idul Fitri (Lebaran)","vi":"Lễ hội xả chay (Tết Indonesia)","th":"วันอีด (ปีใหม่อินโดนีเซีย)","tl":"Eid al-Fitr (Indonesian New Year)"},"content":{"id":"Libur di Indonesia, tidak libur di Taiwan. Setelah sebulan berpuasa, umat Muslim merayakan kemenangan dan saling memaafkan.","vi":"Đài Loan không nghỉ. Ngày lễ quan trọng nhất của Indonesia! Ăn mừng và tha thứ cho nhau sau tháng ăn chay.","th":"ไต้หวันไม่หยุด วันสำคัญที่สุดของอินโดนีเซีย! เฉลิมฉลองและขออภัยซึ่งกันและกันหลังเดือนถือศีลอด","tl":"May pasok sa Taiwan. Pinakamahalagang holiday sa Indonesia! Nagdiriwang at nagpapatawaran ang mga Muslim pagkatapos mag-ayuno."},"greeting":{"zh":"開齋節快樂","id":"Selamat Idul Fitri / 開齋節快樂","vi":"Selamat Idul Fitri / 開齋節快樂","th":"Selamat Idul Fitri / 開齋節快樂","tl":"Selamat Idul Fitri / 開齋節快樂"}},

        {"country":"vi","icon":"🥣","zhTitle":"殺蟲節 (端午)","period":{"id":"農曆五月初五","vi":"農曆五月初五","th":"農曆五月初五","tl":"農曆五月初五"},"title":{"id":"Festival Bunuh Serangga","vi":"Tết Đoan Ngọ (Tết giết sâu bọ)","th":"เทศกาลกำจัดแมลง","tl":"Pest-killing Festival"},"content":{"id":"Tidak libur. Festival ini disebut \u0027Bunuh Serangga\u0027 di VN. Mereka makan ketan fermentasi (Rượu nếp) dan buah asam pagi-pagi untuk membunuh penyakit.","vi":"Đài Loan cho nghỉ. Tết Đoan Ngọ ở VN gọi là Tết Giết Sâu Bọ. Mọi người ăn rượu nếp, trái cây chua vào sáng sớm để diệt mầm bệnh.","th":"หยุดในไต้หวัน แต่เวียดนามเรียก \u0027เทศกาลกำจัดแมลง\u0027 นิยมกินข้าวหมากและผลไม้รสเปรี้ยวเพื่อฆ่าเชื้อโรค","tl":"May pasok sa Taiwan. Tinatawag na \u0027Pest-killing Festival\u0027. Kumakain sila ng fermented sticky rice at maasim na prutas para pumatay ng sakit."},"greeting":{"zh":"","id":"Tết Đoan Ngọ bình an","vi":"Tết Đoan Ngọ bình an","th":"Tết Đoan Ngọ bình an","tl":"Tết Đoan Ngọ bình an"}},
        {"country":"th","icon":"💦","zhTitle":"潑水節 (宋干節)","period":{"id":"4月13-15日 (April)","vi":"4月13-15日 (April)","th":"4月13-15日 (April)","tl":"4月13-15日 (April)"},"title":{"id":"Festival Songkran","vi":"Tết Té Nước (Songkran)","th":"เทศกาลสงกรานต์","tl":"Songkran (Thai New Year)"},"content":{"id":"Libur di Thailand. Tahun Baru tradisional Thailand! Saling menyiram air untuk membasuh kesialan masa lalu.","vi":"Đài Loan không nghỉ. Năm mới Thái Lan! Té nước vào nhau để xua đuổi xui xẻo và đón chào khởi đầu mới.","th":"ไต้หวันไม่หยุด วันปีใหม่ไทย! ผู้คนจะเล่นสาดน้ำเพื่อล้างความโชคร้ายและต้อนรับสิ่งดีๆ เข้ามา","tl":"May pasok sa Taiwan. Thai New Year! Nagbabasaan ang mga tao para hugasan ang malas ng nakaraang taon."},"greeting":{"zh":"新年快樂","id":"Sawasdee Pi Mai / 新年快樂","vi":"Sawasdee Pi Mai / 新年快樂","th":"Sawasdee Pi Mai / 新年快樂","tl":"Sawasdee Pi Mai / 新年快樂"}},
        {"country":"th","icon":"🕯️","zhTitle":"水燈節","period":{"id":"泰曆 12 月 15 日","vi":"泰曆 12 月 15 日","th":"泰曆 12 月 15 日","tl":"泰曆 12 月 15 日"},"title":{"id":"Loy Krathong","vi":"Lễ hội hoa đăng","th":"วันลอยกระทง","tl":"Loy Krathong Festival"},"content":{"id":"Tidak libur di Taiwan. Menghanyutkan \u0027Krathong\u0027 (lampion air) dari bunga dan lilin ke sungai untuk berterima kasih pada dewi air.","vi":"Đài Loan không nghỉ. Thả đèn hoa đăng xuống sông để tạ ơn thần nước và cầu xua tan xui xẻo.","th":"ไต้หวันไม่หยุด ผู้คนจะลอยกระทงที่ทำจากดอกไม้และเทียนลงในแม่น้ำเพื่อขมาพระแม่คงคาและสะเดาะเคราะห์","tl":"May pasok sa Taiwan. Nagpapalutang ng mga bulaklak at kandila sa ilog para magpasalamat sa water goddess at alisin ang malas."},"greeting":{"zh":"水燈節快樂","id":"สุขสันต์วันลอยกระทง / 水燈節快樂","vi":"สุขสันต์วันลอยกระทง / 水燈節快樂","th":"สุขสันต์วันลอยกระทง / 水燈節快樂","tl":"สุขสันต์วันลอยกระทง / 水燈節快樂"}},
        {"country":"th","icon":"🪷","zhTitle":"佛誕節 (衛塞節)","period":{"id":"泰曆 6 月 15 日","vi":"泰曆 6 月 15 日","th":"泰曆 6 月 15 日","tl":"泰曆 6 月 15 日"},"title":{"id":"Visakha Bucha","vi":"Lễ Phật Đản","th":"วันวิสาขบูชา","tl":"Visakha Bucha Day"},"content":{"id":"Libur di Thailand. Hari suci Buddha. Orang Thailand pergi ke kuil membawa lilin. Penjualan alkohol dilarang secara nasional hari ini!","vi":"Đài Loan không nghỉ. Lễ quan trọng nhất của Phật giáo. Người Thái đi chùa nghe kinh. Cấm bán rượu bia trên toàn quốc vào ngày này.","th":"ไต้หวันไม่หยุด วันสำคัญทางพระพุทธศาสนา มีการเวียนเทียนที่วัด ห้ามขายเครื่องดื่มแอลกอฮอล์ทั่วประเทศในวันนี้","tl":"May pasok sa Taiwan. Pinakabanal na araw ng mga Buddhist. Bawal magbenta ng alak sa buong bansa sa araw na ito!"},"greeting":{"zh":"佛誕節平安","id":"สุขสันต์วันวิสาขบูชา / 佛誕節平安","vi":"สุขสันต์วันวิสาขบูชา / 佛誕節平安","th":"สุขสันต์วันวิสาขบูชา / 佛誕節平安","tl":"สุขสันต์วันวิสาขบูชา / 佛誕節平安"}},
        {"country":"th","icon":"👑","zhTitle":"泰國母親節","period":{"id":"8月12日 (Agustus)","vi":"8月12日 (Agustus)","th":"8月12日 (Agustus)","tl":"8月12日 (Agustus)"},"title":{"id":"Hari Ibu Thailand","vi":"Ngày của Mẹ","th":"วันแม่แห่งชาติ","tl":"Mother\u0027s Day"},"content":{"id":"Libur di Thailand. Merayakan ulang tahun Ibu Suri. Memakai baju biru dan memberi bunga melati kepada ibu.","vi":"Đài Loan không nghỉ. Mừng sinh nhật Hoàng thái hậu. Người Thái mặc áo màu xanh lam và tặng hoa nhài cho mẹ.","th":"ไต้หวันไม่หยุด วันคล้ายวันพระราชสมภพของสมเด็จพระพันปีหลวง ประชาชนใส่เสื้อสีฟ้าและมอบดอกมะลิให้แม่","tl":"May pasok sa Taiwan. Birthday ng Queen Mother. Nagsusuot sila ng blue at nagbibigay ng jasmine flower sa mga nanay."},"greeting":{"zh":"母親節快樂","id":"สุขสันต์วันแม่ / 母親節快樂","vi":"สุขสันต์วันแม่ / 母親節快樂","th":"สุขสันต์วันแม่ / 母親節快樂","tl":"สุขสันต์วันแม่ / 母親節快樂"}},
        {"country":"th","icon":"🌼","zhTitle":"泰國父親節","period":{"id":"12月5日 (Desember)","vi":"12月5日 (Desember)","th":"12月5日 (Desember)","tl":"12月5日 (Desember)"},"title":{"id":"Hari Ayah Thailand","vi":"Ngày của Cha","th":"วันพ่อแห่งชาติ","tl":"Father\u0027s Day"},"content":{"id":"Libur di Thailand. Mengenang mendiang Raja Rama IX. Memakai baju kuning dan memberi bunga canna kepada ayah.","vi":"Đài Loan không nghỉ. Tưởng nhớ cố Quốc vương Rama IX. Người Thái mặc áo màu vàng và tặng hoa dong riềng cho cha.","th":"ไต้หวันไม่หยุด วันคล้ายวันพระบรมราชสมภพของในหลวงรัชกาลที่ 9 ประชาชนใส่เสื้อสีเหลืองและมอบดอกพุทธรักษาให้พ่อ","tl":"May pasok sa Taiwan. Paggunita sa yumaong King Rama IX. Nagsusuot ng yellow at nagbibigay ng canna flower sa mga tatay."},"greeting":{"zh":"父親節快樂","id":"สุขสันต์วันพ่อ / 父親節快樂","vi":"สุขสันต์วันพ่อ / 父親節快樂","th":"สุขสันต์วันพ่อ / 父親節快樂","tl":"สุขสันต์วันพ่อ / 父親節快樂"}},
        {"country":"tl","icon":"🎄","zhTitle":"聖誕節","period":{"id":"12月25日 (Desember)","vi":"12月25日 (Desember)","th":"12月25日 (Desember)","tl":"12月25日 (Desember)"},"title":{"id":"Natal","vi":"Lễ Giáng Sinh","th":"วันคริสต์มาส","tl":"Araw ng Pasko"},"content":{"id":"Libur di Filipina. Sangat penting bagi warga Filipina! Dirayakan sejak September, berkumpul bersama keluarga untuk Noche Buena.","vi":"Đài Loan không nghỉ. Giáng sinh quan trọng hơn cả năm mới ở Phil! Ăn mừng từ tháng 9, cả nhà tụ tập ăn tiệc Noche Buena.","th":"ไต้หวันไม่หยุด คริสต์มาสสำคัญกว่าปีใหม่! เริ่มฉลองตั้งแต่กันยายน และรวมญาติกินเลี้ยงในคืน Noche Buena","tl":"May pasok sa Taiwan. Mas mahalaga pa sa New Year! Setyembre pa lang nagdiriwang na, at nagkakasama ang pamilya para sa Noche Buena."},"greeting":{"zh":"聖誕快樂","id":"Merry Christmas / 聖誕快樂","vi":"Merry Christmas / 聖誕快樂","th":"Merry Christmas / 聖誕快樂","tl":"Merry Christmas / 聖誕快樂"}},
        {"country":"tl","icon":"✝️","zhTitle":"聖週 (復活節)","period":{"id":"3-4月 (Maret-April)","vi":"3-4月 (Maret-April)","th":"3-4月 (Maret-April)","tl":"3-4月 (Maret-April)"},"title":{"id":"Pekan Suci (Holy Week)","vi":"Tuần Thánh (Lễ Phục Sinh)","th":"สัปดาห์ศักดิ์สิทธิ์","tl":"Mahal na Araw (Holy Week)"},"content":{"id":"Libur di Filipina. Waktu suci umat Katolik. Orang Filipina pulang kampung, berpuasa, dan mengunjungi beberapa gereja (Visita Iglesia).","vi":"Đài Loan không nghỉ. Thời khắc thiêng liêng của người Công giáo. Người Phil về quê ăn chay, cầu nguyện và thăm nhiều nhà thờ.","th":"ไต้หวันไม่หยุด สัปดาห์ศักดิ์สิทธิ์ของชาวคาทอลิก คนฟิลิปปินส์จะกลับบ้านเกิดเพื่อถือศีลอด อธิษฐาน และไปเยือนหลายโบสถ์","tl":"May pasok sa Taiwan. Sagradong panahon ng mga Katoliko. Umuuwi ang marami sa probinsya para mag-ayuno, magdasal, at mag-Visita Iglesia."},"greeting":{"zh":"","id":"Have a blessed Holy Week","vi":"Have a blessed Holy Week","th":"Have a blessed Holy Week","tl":"Have a blessed Holy Week"}},
        {"country":"tl","icon":"🕯️","zhTitle":"諸聖節 (萬聖節)","period":{"id":"11月1日 (November)","vi":"11月1日 (November)","th":"11月1日 (November)","tl":"11月1日 (November)"},"title":{"id":"Hari Semua Orang Kudus (Undas)","vi":"Lễ Các Thánh","th":"วันสมโภชนักบุญทั้งหลาย (อุนดาส)","tl":"Araw ng mga Patay (Undas)"},"content":{"id":"Libur di Filipina. Mirip Ceng Beng di Taiwan. Orang Filipina membawa makanan ke makam dan berkumpul bersama keluarga besar di sana.","vi":"Đài Loan không nghỉ. Giống Tết Thanh Minh. Người Phil mang thức ăn đến nghĩa trang thăm tổ tiên và cắm trại tụ tập gia đình.","th":"ไต้หวันไม่หยุด คล้ายวันเช็งเม้ง คนฟิลิปปินส์จะนำอาหารไปกินร่วมกับครอบครัวที่สุสานเพื่อเยี่ยมบรรพบุรุษ บรรยากาศอบอุ่น","tl":"May pasok sa Taiwan. Nagdadala ng pagkain at tent sa sementeryo ang mga Pilipino para bisitahin ang mga yumao at mag-reunion."},"greeting":{"zh":"","id":"Happy All Saints\u0027 Day","vi":"Happy All Saints\u0027 Day","th":"Happy All Saints\u0027 Day","tl":"Happy All Saints\u0027 Day"}},
        {"country":"tl","icon":"⛪","zhTitle":"晨星彌撒 (Simbang Gabi)","period":{"id":"12月16-24日 (Desember)","vi":"12月16-24日 (Desember)","th":"12月16-24日 (Desember)","tl":"12月16-24日 (Desember)"},"title":{"id":"Simbang Gabi","vi":"Thánh lễ rạng sáng","th":"พิธีมิสซารุ่งอรุณ","tl":"Simbang Gabi"},"content":{"id":"Tradisi Natal terpenting! Misa subuh jam 4 pagi berturut-turut 9 hari. Setelah itu makan kue beras ungu (Puto Bumbong).","vi":"Truyền thống Giáng sinh quan trọng nhất! 9 ngày liên tiếp đi lễ lúc 4 giờ sáng. Sau đó ăn bánh gạo nếp cẩm (Puto Bumbong).","th":"ประเพณีคริสต์มาสที่สำคัญที่สุด! ไปโบสถ์ตอนตี 4 ติดต่อกัน 9 วัน และกินขนมข้าวเหนียวสีม่วง (Puto Bumbong) หลังทำพิธี","tl":"Pinakamahalagang tradisyon tuwing Pasko! Simbang Gabi nang 9 na sunod-sunod na araw tuwing 4 AM. Kumakain ng Puto Bumbong pagkatapos."},"greeting":{"zh":"","id":"Maligayang Pasko","vi":"Maligayang Pasko","th":"Maligayang Pasko","tl":"Maligayang Pasko"}},
        {"country":"tl","icon":"🇵🇭","zhTitle":"菲律賓獨立日","period":{"id":"6月12日 (Juni)","vi":"6月12日 (Juni)","th":"6月12日 (Juni)","tl":"6月12日 (Juni)"},"title":{"id":"Hari Kemerdekaan Filipina","vi":"Ngày Độc lập Philippines","th":"วันประกาศอิสรภาพฟิลิปปินส์","tl":"Araw ng Kalayaan"},"content":{"id":"Libur di Filipina. Merayakan kemerdekaan. Banyak pekerja migran di Taiwan memposting bendera di medsos untuk merayakannya.","vi":"Đài Loan không nghỉ. Kỷ niệm ngày độc lập. Lao động tại Đài Loan thường chia sẻ hình cờ tổ quốc trên mạng để thể hiện lòng yêu nước.","th":"ไต้หวันไม่หยุด วันประกาศอิสรภาพ แรงงานในไต้หวันมักจะแชร์รูปธงชาติในโซเชียลมีเดียเพื่อแสดงความรักชาติ","tl":"May pasok sa Taiwan. Pagdiriwang ng kalayaan mula sa mga mananakop. Nagpo-post ang mga OFW ng watawat sa social media para magdiwang."},"greeting":{"zh":"","id":"Maligayang Araw ng Kalayaan","vi":"Maligayang Araw ng Kalayaan","th":"Maligayang Araw ng Kalayaan","tl":"Maligayang Araw ng Kalayaan"}},
        {"country":"tw","icon":"🎓","zhTitle":"青年節 / 教師節","period":{"id":"29 Maret / 28 September","vi":"29 tháng 3 / 28 tháng 9","th":"29 มีนาคม / 28 กันยายน","tl":"Marso 29 / Setyembre 28"},"title":{"id":"Hari Pemuda / Hari Guru","vi":"Ngày Thanh niên / Ngày Nhà giáo","th":"วันเยาวชน / วันครู","tl":"Youth Day / Teacher's Day"},"content":{"id":"Hari Pemuda biasanya bukan hari libur. Hari Guru di Taiwan menjadi hari libur nasional mulai 2025; periksa pengumuman resmi dan jadwal kerja tahunan.","vi":"Ngày Thanh niên thường không phải ngày nghỉ. Ngày Nhà giáo tại Đài Loan là ngày nghỉ lễ quốc gia từ năm 2025; hãy kiểm tra thông báo chính thức và lịch làm việc hằng năm.","th":"วันเยาวชนโดยทั่วไปไม่ใช่วันหยุด ส่วนวันครูไต้หวันเป็นวันหยุดราชการตั้งแต่ปี 2025 โปรดตรวจสอบประกาศทางการและตารางงานประจำปี","tl":"Karaniwang hindi holiday ang Youth Day. Naging pambansang holiday sa Taiwan ang Teacher's Day simula 2025; tingnan ang opisyal na anunsyo at taunang iskedyul ng trabaho."},"greeting":{"zh":"向青年致意，教師節快樂！","id":"Selamat Hari Pemuda dan Hari Guru","vi":"Chúc mừng Ngày Thanh niên và Ngày Nhà giáo","th":"สุขสันต์วันเยาวชนและวันครู","tl":"Maligayang Youth Day at Teacher's Day"}},

    function loadFavorites() {

            return stored.filter(item =>
                item &&
                (item.type === 'vocab' || item.type === 'grammar' || item.type === 'sentence') &&
                /^\d+$/.test(String(item.id))
            ).map(item => ({
                type: item.type,
                id: String(item.id),
                srsLevel: Number(item.srsLevel) || 0,
                nextReview: Number(item.nextReview) || 0
            }));
        } catch (error) {
            return [];
        }

    function toggleFavorite(type, id) {

        if (existingIndex >= 0) favoriteItems.splice(existingIndex, 1);
        else favoriteItems.push({ type, id: key, srsLevel: 0, nextReview: 0 });
        if (!saveFavorites()) {
            if (existingIndex >= 0) favoriteItems.splice(existingIndex, 0, { type, id: key, srsLevel: 0, nextReview: 0 });

                const word = masterVocab.find(item => String(item.idx) === favorite.id);
                return word ? {
                    ...favorite,
                    title: word.zh,
                    pinyin: word.py,
                    translation: word[currentLang] || '',
                    typeLabel: uiText().favoriteWord,
                    speak: `speakVocab(${Number(favorite.id)})`,
                    rawZh: word.zh
                } : null;
            }
            if (favorite.type === 'sentence') {
                const sent = sentencesData.find(item => String(item.idx) === favorite.id);
                return sent ? {
                    ...favorite,
                    title: sent.zh,
                    pinyin: sent.py,
                    translation: sent[currentLang] || '',
                    typeLabel: navLabels.learn[currentLang] || 'Kalimat',
                    speak: `speakSentence(${Number(favorite.id)})`,
                    rawZh: sent.zh
                } : null;

            return grammar ? {

                title: grammar.zh,
                pinyin: getGrammarPinyin(grammar.zh),

            currentFlashcardIndex = 0;
            renderFlashcardView();
            return;
        }
        const dueItems = allItems.filter(item => (item.srsLevel || 0) === 0);
        const masteredItems = allItems.filter(item => (item.srsLevel || 0) >= 1);
        if (filterMode === 'unsure' && dueItems.length > 0) {
            flashcardDeck = [...dueItems];
        } else {
            // Spaced Repetition ordering: Due / unfamiliar cards first, then mastered cards sorted by oldest review
            flashcardDeck = [
                ...dueItems,
                ...masteredItems.sort((a, b) => (a.nextReview || 0) - (b.nextReview || 0))
            ];
        }
        currentFlashcardIndex = 0;
        isFlashcardFlipped = false;
        sessionUnsureCount = 0;
        sessionKnownCount = 0;
        renderFlashcardView();
    }

    function markFlashcardSRS(known) {
        const card = flashcardDeck[currentFlashcardIndex];
        if (!card) return;
        const target = favoriteItems.find(item => item.type === card.type && item.id === card.id);
        const now = Date.now();
        if (target) {
            if (known) {
                target.srsLevel = Math.min((target.srsLevel || 0) + 1, 5);
                target.nextReview = now + target.srsLevel * 3600 * 1000;
                sessionKnownCount += 1;
            } else {
                target.srsLevel = 0;
                target.nextReview = now;
                sessionUnsureCount += 1;
                // Re-queue unfamiliar card at the end of current deck if deck has remaining cards so they practice again!
                if (flashcardDeck.length - currentFlashcardIndex > 1 && flashcardDeck.length < 25) {
                    flashcardDeck.push({ ...card, srsLevel: 0 });
                }
            }
            saveFavorites();
        }
        updateFlashcardStats();
        currentFlashcardIndex += 1;
        isFlashcardFlipped = false;

    function speakCalendarGreeting(index) {
        const item = cultureCalendarData[index];
        if (!item) return;

        const chineseText = String(item.greeting.zh || item.zhTitle || '').trim();
        const localText = String(item.greeting[item.country] || '')
            .split('/')
            .map(part => part.trim())
            .find(part => part && !/[\u3400-\u9fff]/.test(part)) || '';
        const localeOptions = calendarSpeechLocales[item.country];

        if (!localText || !localeOptions) {
            if (chineseText) speakChinese(chineseText);
            return;
        }
        if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') {
            showChineseSpeechNotice();
            return;
        }

        const synthesis = window.speechSynthesis;
        const requestId = ++chineseSpeechRequestId;
        clearTimeout(chineseSpeechTimer);
        synthesis.cancel();
        synthesis.resume();

        const voices = synthesis.getVoices();
        const localVoice = localeOptions
            .map(locale => voices.find(voice => voice.lang.toLowerCase() === locale.toLowerCase()))
            .find(Boolean)
            || voices.find(voice => /^(id|vi|th|fil|tl)([-_]|$)/i.test(voice.lang));
        const localUtterance = new SpeechSynthesisUtterance(localText);
        localUtterance.lang = localVoice ? localVoice.lang : localeOptions[0];
        localUtterance.rate = 0.85;
        if (localVoice) localUtterance.voice = localVoice;

        const speakChineseGreeting = () => {
            if (requestId !== chineseSpeechRequestId || !chineseText) return;
            const chineseVoice = voices.find(voice => /^zh[-_]TW$/i.test(voice.lang))
                || voices.find(voice => /^zh[-_]Hant/i.test(voice.lang))
                || voices.find(voice => /^zh[-_]CN$/i.test(voice.lang))
                || voices.find(voice => /^zh/i.test(voice.lang));
            const speechRate = chineseText === lastChineseSpeechText ? 0.65 : 0.85;
            lastChineseSpeechText = chineseText;
            const chineseUtterance = new SpeechSynthesisUtterance(chineseText);
            chineseUtterance.lang = chineseVoice ? chineseVoice.lang : 'zh-TW';
            chineseUtterance.rate = speechRate;
            if (chineseVoice) chineseUtterance.voice = chineseVoice;
            chineseUtterance.onerror = event => {
                if (requestId === chineseSpeechRequestId && event.error !== 'canceled' && event.error !== 'interrupted') {
                    showChineseSpeechNotice();
                }
            };
            try {
                synthesis.speak(chineseUtterance);
            } catch (error) {
                if (requestId === chineseSpeechRequestId) showChineseSpeechNotice();
            }
        };

        localUtterance.onstart = () => {
            if (requestId === chineseSpeechRequestId) {
                const notice = document.getElementById('speech-status');
                if (notice) notice.classList.add('hidden');
            }
        };
        localUtterance.onend = speakChineseGreeting;
        localUtterance.onerror = event => {
            if (requestId === chineseSpeechRequestId && event.error !== 'canceled' && event.error !== 'interrupted') {
                speakChineseGreeting();
            }
        };
        try {
            synthesis.speak(localUtterance);
        } catch (error) {
            if (requestId === chineseSpeechRequestId) showChineseSpeechNotice();
        }
    }

    function getGrammarPinyin(text) {
        let result = '';
        const appendSyllable = syllable => {
            const needsSpace = result && !/[\s(+/]$/.test(result);
            result += `${needsSpace ? ' ' : ''}${syllable}`;
        };
        for (let index = 0; index < text.length;) {
            const phrase = Object.keys(grammarPhrasePinyin)
                .find(candidate => text.startsWith(candidate, index));
            if (phrase) {
                grammarPhrasePinyin[phrase].forEach(appendSyllable);
                index += phrase.length;
                continue;
            }
            const char = text[index];
            const syllable = grammarCharacterPinyin[char];
            if (syllable) {
                appendSyllable(syllable);
            } else {
                if (/[A-Za-z]/.test(char) && result && !/\s$/.test(result)) result += ' ';
                result += char;
            }
            index += 1;
        }
        return result;
    }

    let gamePinyinVocabulary = null;
    let gamePinyinCharacterMap = null;
    function getGamePinyin(text) {
        const source = String(text || '');
        if (!source) return '';
        if (gamePinyinPhraseOverrides[source]) return gamePinyinPhraseOverrides[source];
        const exactEntry = masterVocab.find(word => word.zh === source && word.py);
        if (exactEntry && !/[\u3400-\u9fff]/.test(exactEntry.py)) return exactEntry.py;

        if (!gamePinyinVocabulary) {
            gamePinyinVocabulary = masterVocab
                .filter(word => word.zh && word.py && !/[\u3400-\u9fff]/.test(word.py))
                .sort((a, b) => b.zh.length - a.zh.length);
        }
        if (!gamePinyinCharacterMap) {
            const inferredCharacters = {};
            masterVocab.forEach(word => {
                if (!word.zh || !word.py || /[\u3400-\u9fff]/.test(word.py)) return;
                const characters = Array.from(word.zh).filter(char => /[\u3400-\u9fff]/.test(char));
                const syllables = word.py.trim().split(/\s+/);
                if (characters.length === syllables.length) {
                    characters.forEach((char, index) => {
                        if (!inferredCharacters[char]) inferredCharacters[char] = syllables[index];
                    });
                }
            });
            gamePinyinCharacterMap = {
                ...inferredCharacters,
                ...grammarCharacterPinyin,
                ...gamePinyinCharacterOverrides
            };
        }

        const phrases = Object.keys(gamePinyinPhraseOverrides).sort((a, b) => b.length - a.length);
        let result = '';
        let hasUnknownHan = false;
        const append = value => {
            if (result && !/[\s(+/]$/.test(result) && !/^[,，。！？；：、.)]/.test(value)) result += ' ';
            result += value;
        };

        for (let index = 0; index < source.length;) {
            const phrase = phrases.find(candidate => source.startsWith(candidate, index));
            if (phrase) {
                append(gamePinyinPhraseOverrides[phrase]);
                index += phrase.length;
                continue;
            }

            const vocabEntry = gamePinyinVocabulary.find(word => source.startsWith(word.zh, index));
            if (vocabEntry) {
                append(vocabEntry.py);
                index += vocabEntry.zh.length;
                continue;
            }

            const char = source[index++];
            if (/[\u3400-\u9fff]/.test(char)) {
                const syllable = gamePinyinCharacterMap[char];
                if (syllable) append(syllable);
                else hasUnknownHan = true;
            } else {
                if (/[A-Za-z]/.test(char) && result && !/\s$/.test(result)) result += ' ';
                result += char;
            }
        }
        return hasUnknownHan ? '' : result.trim();
    }
    function getGameOptionPinyin(chinese, suppliedPinyin) {
        return suppliedPinyin && !/[\u3400-\u9fff]/.test(suppliedPinyin) && !suppliedPinyin.includes('___')

            : getGamePinyin(chinese);
    }

        { id: 'Saat polisi melakukan pemeriksaan, saya berlari karena tidak membawa kartu ARC.', vi: 'Khi cảnh sát kiểm tra, tôi bỏ chạy vì không mang theo thẻ cư trú.', th: 'ตอนตำรวจตรวจค้น ฉันหันหลังวิ่งหนีเพราะไม่ได้พกบัตร ARC', tl: 'Tumakbo ako nang magsagawa ng inspeksyon ang pulis dahil wala akong dalang ARC.' },
        { id: 'Majikan berkata kinerja saya buruk dan akan langsung membeli tiket pesawat untuk memulangkan saya besok.', vi: 'Chủ lao động nói tôi làm việc kém và sẽ mua vé máy bay đưa tôi về nước ngay ngày mai.', th: 'นายจ้างบอกว่าฉันทำงานไม่ดีและจะซื้อตั๋วเครื่องบินส่งฉันกลับประเทศพรุ่งนี้เลย', tl: 'Sabi ng amo, mahina ang performance ko at bibili siya agad ng tiket para pauwiin ako bukas.' },
        { id: 'Saya mengalami pelecehan seksual di pabrik, langsung menolaknya dengan tegas, lalu mengadu melalui hotline 1955.', vi: 'Tôi bị quấy rối tình dục ở nhà máy, lập tức lên tiếng từ chối và gọi đường dây 1955 để khiếu nại.', th: 'ฉันถูกคุกคามทางเพศในโรงงาน จึงปฏิเสธเสียงดังทันทีและร้องเรียนผ่านสายด่วน 1955', tl: 'Nakaranas ako ng sexual harassment sa pabrika, mariin akong tumanggi at agad na nagreklamo sa hotline 1955.' },
        { id: 'Majikan tahu saya beragama Islam, tetapi melarang saya beribadah saat waktu istirahat di pabrik.', vi: 'Chủ lao động biết tôi theo đạo Hồi nhưng không cho tôi cầu nguyện trong giờ nghỉ ở nhà máy.', th: 'นายจ้างรู้ว่าฉันนับถือศาสนาอิสลาม แต่ไม่อนุญาตให้ฉันละหมาดในช่วงพักที่โรงงาน', tl: 'Alam ng amo na Muslim ako pero hindi niya ako pinapayagang magdasal tuwing break sa pabrika.' },
        { id: 'Majikan memaksa saya makan bekal yang mengandung babi dan berkata pabrik hanya menyediakan makanan itu.', vi: 'Chủ lao động ép tôi ăn cơm hộp có thịt heo và nói nhà máy chỉ có món này.', th: 'นายจ้างบังคับให้ฉันกินข้าวกล่องที่มีเนื้อหมู โดยบอกว่าโรงงานมีแต่อาหารแบบนี้', tl: 'Pinipilit akong kumain ng pagkaing may baboy at sabi ng amo iyon lang ang pagkain sa pabrika.' },
        { id: 'Saya mengalami perselisihan kerja dan mengajukan mediasi perselisihan tenaga kerja ke kantor tenaga kerja setempat.', vi: 'Tôi gặp tranh chấp lao động và nộp đơn xin hòa giải tại cơ quan lao động địa phương.', th: 'ฉันมีข้อพิพาทแรงงานและยื่นขอไกล่เกลี่ยกับสำนักงานแรงงานในพื้นที่', tl: 'Dahil may alitan ako sa trabaho, nag-apply ako ng labor dispute mediation sa lokal na labor office.' },
        { id: 'Pesanan pabrik belum selesai, lalu majikan menetapkan semua orang wajib bekerja 14 jam setiap hari.', vi: 'Đơn hàng nhà máy chưa làm xong nên chủ lao động yêu cầu mọi người làm 14 giờ mỗi ngày.', th: 'งานสั่งซื้อในโรงงานยังไม่เสร็จ นายจ้างจึงกำหนดให้ทุกคนทำงานวันละ 14 ชั่วโมง', tl: 'Dahil hindi pa tapos ang mga order, ipinag-utos ng amo na magtrabaho ang lahat nang 14 na oras bawat araw.' },
        { id: 'Majikan meminta saya lembur pada hari Sabtu dan membayar upah lembur 1,34 hingga 1,67 kali lipat.', vi: 'Chủ lao động yêu cầu tôi tăng ca thứ Bảy và trả tiền tăng ca gấp 1,34 đến 1,67 lần.', th: 'นายจ้างขอให้ฉันทำโอทีวันเสาร์และจ่ายค่าล่วงเวลา 1.34 ถึง 1.67 เท่า', tl: 'Pinag-o-overtime ako ng amo tuwing Sabado at binabayaran ng 1.34 hanggang 1.67 na beses ng sahod.' },
        { id: 'Tangan saya terluka terpotong mesin saat bekerja, tetapi majikan menyuruh saya membayar biaya medis sendiri.', vi: 'Tay tôi bị máy cắt khi đang làm việc nhưng chủ lao động bảo tôi tự trả viện phí.', th: 'มือฉันถูกเครื่องตัดขณะทำงาน แต่นายจ้างบอกให้ฉันจ่ายค่ารักษาเอง', tl: 'Naputol ang kamay ko sa makina habang nagtatrabaho, pero ako raw ang magbabayad ng gastusing medikal.' },
        { id: 'Pabrik tidak menyediakan kacamata pelindung dan sarung tangan, tetapi menyuruh saya langsung mengoperasikan mesin pemotong.', vi: 'Nhà máy không phát kính bảo hộ và găng tay nhưng bảo tôi vận hành máy cắt ngay.', th: 'โรงงานไม่แจกแว่นตานิรภัยและถุงมือ แต่สั่งให้ฉันใช้เครื่องตัดทันที', tl: 'Walang ibinigay na safety goggles o guwantes ang pabrika pero pinapatakbo agad sa akin ang cutting machine.' },
        { id: 'Setelah bekerja tujuh hari berturut-turut, saya meminta satu hari istirahat mingguan kepada majikan.', vi: 'Sau khi làm việc liên tục bảy ngày, tôi yêu cầu chủ lao động cho nghỉ một ngày nghỉ định kỳ.', th: 'หลังทำงานติดต่อกันเจ็ดวัน ฉันขอให้นายจ้างให้หยุดพักประจำสัปดาห์หนึ่งวัน', tl: 'Pagkatapos magtrabaho nang pitong araw na sunod-sunod, humingi ako ng isang araw na lingguhang pahinga sa amo.' },
        { id: 'Saya dipekerjakan sebagai perawat untuk merawat kakek, tetapi majikan menyuruh saya membantu mencuci piring di restoran sarapannya.', vi: 'Tôi được thuê chăm sóc ông nhưng chủ lao động lại bảo tôi rửa bát ở quán ăn sáng của họ.', th: 'ฉันได้รับจ้างให้ดูแลคุณตา แต่นายจ้างกลับสั่งให้ไปช่วยล้างจานที่ร้านอาหารเช้าของเขา', tl: 'Kinuha akong caregiver para alagaan si Lolo, pero pinaghuhugas ako ng pinggan sa breakfast shop ng amo.' },
        { id: 'Pemerintah mengumumkan penghentian kerja karena topan, tetapi majikan mengancam akan memotong bonus kehadiran jika saya tidak masuk.', vi: 'Chính phủ thông báo nghỉ làm vì bão nhưng chủ lao động dọa trừ thưởng chuyên cần nếu tôi không đi làm.', th: 'รัฐบาลประกาศหยุดงานเพราะไต้ฝุ่น แต่นายจ้างขู่ว่าจะหักโบนัสการมาทำงานหากฉันไม่ไปทำงาน', tl: 'Nag-anunsyo ang gobyerno ng suspensyon ng trabaho dahil sa bagyo, pero nagbanta ang amo na ibabawas ang attendance bonus kung hindi ako papasok.' },
        { id: 'Saya sakit dan demam tinggi. Saya membawa surat keterangan dokter dari klinik untuk meminta cuti sakit dengan setengah gaji.', vi: 'Tôi bị sốt cao và mang giấy chẩn đoán của phòng khám đến xin nghỉ ốm hưởng nửa lương.', th: 'ฉันป่วยและมีไข้สูง จึงนำใบรับรองแพทย์จากคลินิกไปขอลาป่วยโดยได้รับค่าจ้างครึ่งหนึ่ง', tl: 'May sakit at mataas ang lagnat ko kaya nagdala ako ng medical certificate mula sa klinika para humingi ng sick leave na kalahating sahod.' },
        { id: 'Saya mengetahui bahwa saya hamil, lalu agen mengatakan pekerja migran yang hamil harus segera pulang.', vi: 'Tôi phát hiện mình mang thai, môi giới nói lao động nhập cư mang thai phải về nước ngay.', th: 'ฉันพบว่าตัวเองตั้งครรภ์ แต่นายหน้าบอกว่าแรงงานข้ามชาติที่ตั้งครรภ์ต้องกลับประเทศทันที', tl: 'Nalaman kong buntis ako, at sabi ng ahensya kailangan agad umuwi ang migrant worker na buntis.' },
        { id: 'Saya sedang memulihkan kaki yang terluka akibat kecelakaan kerja, tetapi majikan memecat saya karena saya tidak bisa bekerja.', vi: 'Tôi đang hồi phục chân bị thương do tai nạn lao động nhưng chủ lao động sa thải tôi vì không thể làm việc.', th: 'ฉันกำลังพักฟื้นขาที่บาดเจ็บจากอุบัติเหตุในการทำงาน แต่นายจ้างไล่ฉันออกเพราะทำงานไม่ได้', tl: 'Nagpapagaling ako sa binting napinsala sa aksidente sa trabaho pero tinanggal ako ng amo dahil hindi raw ako makapagtrabaho.' },
        { id: 'Saya baru membeli kendaraan listrik roda dua berukuran kecil dan langsung mengendarainya di jalan tanpa memasang pelat nomor.', vi: 'Tôi vừa mua xe điện hai bánh cỡ nhỏ và chạy ra đường ngay mà chưa gắn biển số.', th: 'ฉันเพิ่งซื้อรถไฟฟ้าสองล้อขนาดเล็กและขี่บนถนนทันทีโดยไม่ได้ติดป้ายทะเบียน', tl: 'Kakabili ko lang ng maliit na electric two-wheeler at minaneho ko ito sa kalsada nang walang plaka.' },
        { id: 'Setelah pulang kerja saya minum dua botol bir. Merasa tidak mabuk, saya mengendarai sepeda listrik kembali ke asrama.', vi: 'Tan làm tôi uống hai chai bia, nghĩ mình không say nên đi xe đạp điện về ký túc xá.', th: 'หลังเลิกงานฉันดื่มเบียร์สองขวด คิดว่าไม่เมาจึงขี่จักรยานไฟฟ้ากลับหอพัก', tl: 'Uminom ako ng dalawang bote ng beer pagkatapos ng trabaho. Akala ko hindi ako lasing kaya nag-e-bike ako pauwi sa dormitoryo.' },
        { id: 'Di Kota Taipei, saya mengemas botol plastik dan kardus secara terpisah lalu menyerahkannya kepada truk daur ulang.', vi: 'Ở thành phố Đài Bắc, tôi đóng gói riêng chai nhựa và thùng giấy rồi giao cho xe thu gom tái chế.', th: 'ในนครไทเป ฉันแยกบรรจุขวดพลาสติกกับกล่องกระดาษแล้วนำไปให้รถเก็บขยะรีไซเคิล', tl: 'Sa Taipei City, pinaghiwalay at ibinalot ko ang mga plastik na bote at karton para ibigay sa recycling truck.' },
        { id: 'Di Kota New Taipei, agar hemat uang saya membuang sampah dalam kantong plastik hitam biasa ke truk sampah.', vi: 'Ở Tân Bắc, để tiết kiệm tiền tôi bỏ rác vào túi nhựa đen thông thường rồi cho lên xe rác.', th: 'ในนครนิวไทเป ฉันใช้ถุงพลาสติกสีดำทั่วไปใส่ขยะแล้วทิ้งลงรถขยะเพื่อประหยัดเงิน', tl: 'Sa New Taipei City, gumamit ako ng ordinaryong itim na plastic bag para sa basura at itinapon ito sa garbage truck para makatipid.' },
        { id: 'Saya merasa haus di dalam gerbong MRT, lalu mengeluarkan minuman teh yang dibeli dan meminumnya.', vi: 'Tôi thấy khát trong toa tàu điện ngầm nên lấy trà mua sẵn ra uống.', th: 'ฉันรู้สึกกระหายในขบวนรถไฟฟ้า จึงหยิบชาไข่มุกออกมาดื่มหนึ่งอึก', tl: 'Nauhaw ako sa loob ng MRT kaya inilabas ko ang biniling inumin at uminom.' },
        { id: 'Saat mengendarai sepeda listrik, saya memakai helm keselamatan yang memenuhi standar dan mematuhi lampu lalu lintas.', vi: 'Khi đi xe đạp điện, tôi đội mũ bảo hiểm đạt chuẩn và tuân thủ đèn giao thông.', th: 'ขณะขี่จักรยานไฟฟ้า ฉันสวมหมวกนิรภัยที่ได้มาตรฐานและปฏิบัติตามสัญญาณไฟจราจร', tl: 'Nagsuot ako ng aprubadong helmet at sumunod sa traffic lights habang nagbibisikleta nang de-kuryente.' },
        { id: 'Saat menunggu kereta di aula dalam stasiun, saya menyalakan sebatang rokok dan merokok.', vi: 'Khi chờ tàu ở sảnh bên trong nhà ga, tôi châm một điếu thuốc để hút.', th: 'ระหว่างรอรถไฟในโถงด้านในสถานี ฉันจุดบุหรี่สูบหนึ่งมวน', tl: 'Nagsindi ako ng sigarilyo habang naghihintay ng tren sa loob na bulwagan ng istasyon.' },
        { id: 'Saya mengendarai sepeda motor bersama teman dan kami berdua tidak memakai helm hanya untuk bersenang-senang.', vi: 'Tôi chở bạn bằng xe máy và cả hai không đội mũ bảo hiểm chỉ để vui chơi.', th: 'ฉันขี่มอเตอร์ไซค์พาเพื่อนซ้อน และเราสองคนไม่สวมหมวกกันน็อกเพราะคิดว่าสนุก', tl: 'Nagsakay ako ng kaibigan sa motorsiklo at pareho kaming walang helmet para lang mag-enjoy.' },
        { id: 'Saya menangkap beberapa merpati liar di taman untuk dibawa kembali ke asrama sebagai lauk.', vi: 'Tôi bắt vài con bồ câu hoang trong công viên mang về ký túc xá làm món ăn.', th: 'ฉันจับนกพิราบป่าสองสามตัวในสวนกลับไปทำกับข้าวที่หอพัก', tl: 'Nanghuli ako ng ilang ligaw na kalapati sa parke para iuwi sa dormitoryo at gawing ulam.' },
        { id: 'Saya merasa tidak enak badan, pergi ke klinik untuk berobat flu dengan kartu NHI, dan hanya membayar biaya pendaftaran NT$200.', vi: 'Tôi không khỏe nên dùng thẻ bảo hiểm y tế đi khám cảm ở phòng khám và chỉ trả phí đăng ký 200 Đài tệ.', th: 'ฉันไม่สบายและใช้บัตรประกันสุขภาพไปคลินิกเพื่อตรวจหวัด โดยจ่ายค่าลงทะเบียนเพียง 200 ดอลลาร์ไต้หวัน', tl: 'Masama ang pakiramdam ko kaya ginamit ko ang NHI card sa klinika para magpatingin sa sipon at NT$200 lang ang binayaran ko.' },
        { id: 'Seorang teman sekampung meminta meminjam kartu ATM saya untuk menerima transfer dan menawarkan NT$3.000 setiap bulan.', vi: 'Một người đồng hương mượn thẻ ATM của tôi để nhận chuyển khoản và hứa trả 3.000 Đài tệ mỗi tháng.', th: 'คนบ้านเดียวกันขอยืมบัตรเอทีเอ็มของฉันเพื่อรับโอนเงิน และจะให้เดือนละ 3,000 ดอลลาร์ไต้หวัน', tl: 'Hinihiram ng kababayan ko ang ATM card ko para sa mga transfer at nag-aalok ng NT$3,000 bawat buwan.' },
        { id: 'Saya melihat di Facebook tawaran kerja mengemas sayuran saat hari libur dengan upah tunai NT$2.000 sehari, lalu langsung pergi bekerja.', vi: 'Tôi thấy trên Facebook tin tuyển việc đóng gói rau ngày nghỉ, trả 2.000 Đài tệ tiền mặt mỗi ngày, rồi lập tức đi làm.', th: 'ฉันเห็นประกาศใน Facebook ว่าจ้างแพ็กผักในวันหยุด ได้เงินสดวันละ 2,000 ดอลลาร์ไต้หวัน แล้วรีบไปทำงานทันที', tl: 'Nakakita ako sa Facebook ng trabahong magbalot ng gulay tuwing day off kapalit ng NT$2,000 cash bawat araw at agad akong pumasok.' },
        { id: 'Setiap bulan saya mengirim uang ke kampung halaman melalui bank atau aplikasi resmi.', vi: 'Mỗi tháng tôi chuyển tiền về quê qua ngân hàng hoặc ứng dụng hợp pháp.', th: 'ทุกเดือนฉันโอนเงินกลับบ้านผ่านธนาคารหรือแอปที่ถูกกฎหมาย', tl: 'Buwan-buwan akong nagpapadala ng pera sa amin sa pamamagitan ng bangko o legal na app.' },
        { id: 'Pemilik toko kelontong berkata nilai tukar di tokonya lebih baik dan menyuruh saya menyerahkan uang tunai agar ia mengirimkannya ke negara asal.', vi: 'Chủ tiệm tạp hóa nói tỷ giá ở đó tốt hơn và bảo tôi đưa tiền mặt để họ chuyển về nước.', th: 'เจ้าของร้านขายของชำบอกว่าอัตราแลกเปลี่ยนที่ร้านดีกว่า และให้ฉันนำเงินสดมาเพื่อโอนกลับประเทศ', tl: 'Sabi ng may-ari ng tindahan, mas maganda ang palitan niya kaya ibigay ko raw sa kanya ang cash para ipadala sa bansa ko.' },
        { id: 'Agen berkata akan membantu mengurus dokumen dan meminta saya membawa kartu ARC ke toko telekomunikasi untuk membuat tiga nomor telepon tambahan atas namanya.', vi: 'Môi giới nói sẽ giúp làm giấy tờ và yêu cầu tôi mang thẻ cư trú đến cửa hàng viễn thông đăng ký thêm ba số điện thoại cho họ.', th: 'นายหน้าบอกว่าจะช่วยจัดการเอกสารและขอให้ฉันนำบัตร ARC ไปทำหมายเลขโทรศัพท์เพิ่มอีกสามหมายเลขให้เขา', tl: 'Sabi ng ahensya tutulungan ako sa mga dokumento at pinapapunta akong magpagawa ng tatlong karagdagang numero gamit ang ARC ko.' },
        { id: 'Saya berkenalan di internet dengan seorang perwira militer asing. Ia berkata hadiah yang dikirimnya tertahan di bea cukai dan meminta saya mentransfer NT$50.000 terlebih dahulu.', vi: 'Tôi quen một sĩ quan quân đội nước ngoài trên mạng. Người đó nói quà gửi cho tôi bị giữ ở hải quan và yêu cầu chuyển trước 50.000 Đài tệ.', th: 'ฉันรู้จักนายทหารต่างชาติคนหนึ่งทางอินเทอร์เน็ต เขาบอกว่าของขวัญที่ส่งมาให้ติดอยู่ที่ศุลกากรและขอให้ฉันโอนเงิน 50,000 ดอลลาร์ไต้หวันก่อน', tl: 'May nakilala akong dayuhang opisyal ng militar online. Sabi niya, naipit sa customs ang regalong ipinadala niya at kailangan kong magpadala muna ng NT$50,000.' },
        { id: 'Saya melihat seseorang di internet menawarkan bantuan mengikuti undian dan meminta kata sandi bank saya, jadi saya langsung memblokirnya.', vi: 'Tôi thấy có người trên mạng nói có thể giúp tham gia rút thăm và yêu cầu mật khẩu ngân hàng, nên tôi chặn họ ngay.', th: 'ฉันเห็นคนบนอินเทอร์เน็ตบอกว่าจะช่วยลุ้นรางวัลและขอรหัสผ่านธนาคาร ฉันจึงบล็อกเขาทันที', tl: 'May nakita akong nag-aalok tumulong sa raffle pero hinihingi ang password ng bangko ko, kaya agad ko siyang blinock.' },
        { id: 'Teman berkata jika saya meminjamkan paspor untuk mengajukan pinjaman ponsel, ia akan mentraktir saya makan besar.', vi: 'Bạn tôi nói nếu cho mượn hộ chiếu để làm khoản vay mua điện thoại thì sẽ mời tôi ăn một bữa thịnh soạn.', th: 'เพื่อนบอกว่าถ้าฉันให้ยืมหนังสือเดินทางไปขอสินเชื่อโทรศัพท์ เขาจะเลี้ยงอาหารมื้อใหญ่', tl: 'Sabi ng kaibigan ko, ilibre niya ako ng masarap na pagkain kung ipapahiram ko ang pasaporte ko para sa phone loan.' },
        { id: 'Majikan mengancam akan melaporkan kebohongan ke polisi bahwa saya mencuri jika saya tidak setuju gaji saya dipotong.', vi: 'Chủ lao động đe dọa báo cảnh sát vu khống tôi ăn cắp nếu tôi không đồng ý bị trừ lương.', th: 'นายจ้างขู่ว่าจะแจ้งตำรวจเท็จว่าฉันขโมยของ หากฉันไม่ยอมให้หักเงินเดือน', tl: 'Nagbanta ang amo na magsisinungaling sa pulis at aakusahan akong nagnakaw kung hindi ako papayag na kaltasan ang sahod.' },
        { id: 'Saya telah bekerja selama lima tahun sebagai tenaga teknis tingkat menengah, memenuhi syarat gaji, lalu mengajukan izin tinggal permanen sendiri.', vi: 'Tôi đã làm nhân lực kỹ thuật trung cấp đủ 5 năm, đạt mức lương yêu cầu và tự nộp đơn xin thường trú.', th: 'ฉันทำงานเป็นแรงงานทักษะระดับกลางครบห้าปี มีเงินเดือนถึงเกณฑ์ และยื่นขอถิ่นที่อยู่ถาวรด้วยตนเอง', tl: 'Limang taon na akong middle-level technical worker, pasok sa sahod na kailangan, at ako mismo ang nag-apply ng permanent residence.' }

    const tinderPenaltyTranslations = [
        [`Melanggar hukum! Biaya berlebihan dapat didenda hingga 20 kali jumlah kelebihan dan izin agensi dapat dihentikan.`, `Vi phạm pháp luật! Thu phí quá mức có thể bị phạt tối đa gấp 20 lần số tiền thu vượt và bị đình chỉ hoạt động.`, `ผิดกฎหมาย! การเรียกเก็บเงินเกินอาจถูกปรับสูงสุด 20 เท่าของส่วนที่เกินและถูกสั่งพักใบอนุญาต`, `Ilegal! Maaaring pagmultahin nang hanggang 20 beses ng sobrang singil at masuspinde ang lisensya ng ahensya.`],
        [`Ilegal! Majikan tidak boleh memotong gaji sebagai denda atau jaminan; pelanggaran dapat didenda hingga NT$300.000.`, `Vi phạm pháp luật! Chủ lao động không được tự ý khấu trừ lương làm tiền phạt; có thể bị phạt đến 300.000 Đài tệ.`, `ผิดกฎหมาย! นายจ้างห้ามหักเงินเดือนเป็นค่าปรับ อาจถูกปรับสูงสุด 300,000 ดอลลาร์ไต้หวัน`, `Ilegal! Hindi maaaring magkaltas ng sahod bilang multa ang amo; maaaring pagmultahin nang hanggang NT$300,000.`],
        [`Legal: ini adalah batas atas biaya layanan bulanan yang ditetapkan untuk tahun pertama. Minta tanda terima.`, `Hợp pháp: đây là mức trần phí dịch vụ hằng tháng trong năm đầu tiên. Hãy yêu cầu biên lai.`, `ถูกกฎหมาย: เป็นเพดานค่าบริการรายเดือนที่กำหนดสำหรับปีแรก โปรดขอใบเสร็จ`, `Legal: ito ang itinakdang pinakamataas na buwanang service fee sa unang taon. Humingi ng resibo.`],
        [`Ilegal! Agen tenaga kerja tidak boleh meminta uang jaminan untuk mencegah pekerja pergi.`, `Vi phạm pháp luật! Môi giới không được thu tiền đặt cọc để ngăn người lao động bỏ trốn.`, `ผิดกฎหมาย! บริษัทจัดหางานห้ามเรียกเงินประกันเพื่อป้องกันลูกจ้างหนี`, `Ilegal! Hindi maaaring maningil ng deposito ang ahensya para pigilan kang umalis.`],
        [`Legal dan sesuai kewajiban: pemberi kerja harus memberikan rincian gaji yang dapat dipahami pekerja.`, `Hợp pháp và đúng nghĩa vụ: chủ lao động phải cung cấp bảng lương để người lao động hiểu rõ khoản lương.`, `ถูกกฎหมายและเป็นหน้าที่: นายจ้างต้องให้รายละเอียดค่าจ้างที่ลูกจ้างเข้าใจได้`, `Legal at tungkulin ng employer: dapat magbigay ng malinaw na payslip na nauunawaan ng manggagawa.`],
        [`Ilegal! Upah tidak boleh lebih rendah dari upah minimum yang berlaku, termasuk selama masa percobaan.`, `Vi phạm pháp luật! Lương không được thấp hơn mức lương tối thiểu hiện hành, kể cả trong thời gian thử việc.`, `ผิดกฎหมาย! ค่าจ้างต้องไม่ต่ำกว่าค่าจ้างขั้นต่ำ แม้อยู่ในช่วงทดลองงาน`, `Ilegal! Hindi maaaring mas mababa sa minimum wage ang sahod kahit nasa probation period.`],
        [`Ilegal! Upah harus dibayarkan langsung dan penuh kepada pekerja; perantara tidak boleh mengambilnya untuk dibayarkan kemudian.`, `Vi phạm pháp luật! Tiền lương phải được trả đầy đủ trực tiếp cho người lao động, không giao cho môi giới giữ hộ.`, `ผิดกฎหมาย! ต้องจ่ายค่าจ้างให้ลูกจ้างโดยตรงและครบถ้วน ห้ามให้นายหน้ารับเงินไปจ่ายแทน`, `Ilegal! Dapat buo at direktang ibigay sa manggagawa ang sahod; hindi ito dapat kunin muna ng ahensya.`],
        [`Pemberitahuan 30 hari dapat berlaku untuk pemutusan kontrak secara sah; periksa kontrak dan aturan yang berlaku untuk situasimu.`, `Việc báo trước 30 ngày có thể áp dụng khi chấm dứt hợp đồng; hãy kiểm tra hợp đồng và quy định phù hợp với trường hợp của bạn.`, `การแจ้งล่วงหน้า 30 วันอาจใช้ได้กับการเลิกสัญญาโดยชอบ โปรดตรวจสอบสัญญาและกฎที่ใช้กับกรณีของคุณ`, `Maaaring kailangan ang 30-araw na abiso sa legal na pagwawakas ng kontrata; tingnan ang kontrata at patakarang naaangkop sa iyo.`],
        [`Ilegal! Majikan tidak boleh menahan upah atau meminta denda kontrak untuk menghalangi pekerja mengakhiri hubungan kerja.`, `Vi phạm pháp luật! Chủ lao động không được giữ lương hoặc đòi tiền phạt hợp đồng để ngăn người lao động chấm dứt hợp đồng.`, `ผิดกฎหมาย! นายจ้างห้ามยึดค่าจ้างหรือเรียกค่าปรับสัญญาเพื่อขัดขวางการลาออก`, `Ilegal! Hindi maaaring pigilan ng amo ang pag-alis sa pamamagitan ng pagkulong ng sahod o paniningil ng penalty.`],
        [`Ilegal! Kamu berhak mengurus paspor sendiri; jangan dipaksa memakai jasa perantara atau membayar biaya berlebihan.`, `Vi phạm pháp luật! Bạn có quyền tự làm hộ chiếu; không được ép dùng dịch vụ môi giới hoặc thu phí quá mức.`, `ผิดกฎหมาย! คุณมีสิทธิดำเนินการทำพาสปอร์ตเอง ห้ามบังคับใช้บริการนายหน้าหรือเก็บค่าธรรมเนียมเกินควร`, `Ilegal! Karapatan mong asikasuhin ang pasaporte mo; hindi ka dapat piliting gumamit ng ahensya o magbayad nang sobra.`],
        [`Ilegal! Menahan dokumen identitas dapat menjadi tanda kerja paksa; mintalah bantuan dan hubungi 1955.`, `Vi phạm pháp luật! Việc giữ giấy tờ tùy thân có thể là dấu hiệu cưỡng bức lao động; hãy tìm trợ giúp hoặc gọi 1955.`, `ผิดกฎหมาย! การยึดเอกสารประจำตัวอาจเป็นสัญญาณของการบังคับใช้แรงงาน โปรดขอความช่วยเหลือหรือโทร 1955`, `Ilegal! Maaaring palatandaan ng sapilitang paggawa ang paghawak sa iyong dokumento; humingi ng tulong o tumawag sa 1955.`],
        [`Ilegal! Larangan keluar yang tidak wajar dapat melanggar kebebasan pribadi; cari bantuan jika tidak aman.`, `Vi phạm pháp luật! Lệnh cấm ra ngoài bất hợp lý có thể xâm phạm quyền tự do; hãy tìm trợ giúp nếu bạn không an toàn.`, `ผิดกฎหมาย! การห้ามออกนอกที่พักอย่างไม่สมเหตุสมผลอาจละเมิดเสรีภาพ หากไม่ปลอดภัยให้ขอความช่วยเหลือ`, `Ilegal! Maaaring lumabag sa kalayaan mo ang hindi makatwirang pagbabawal lumabas; humingi ng tulong kung hindi ligtas.`],
        [`Legal! Saat hari libur, kamu boleh bepergian dan menikmati waktu luang dengan membawa dokumen identitas.`, `Hợp pháp! Ngày nghỉ, bạn có thể đi chơi và nghỉ ngơi; hãy mang theo giấy tờ tùy thân.`, `ถูกกฎหมาย! ในวันหยุดคุณมีสิทธิเดินทางและพักผ่อน ควรพกเอกสารประจำตัว`, `Legal! Maaari kang mamasyal at magpahinga sa araw na walang pasok; dalhin ang iyong ID.`],
        [`Ilegal! Mengambil ponsel tanpa alasan yang sah dapat melanggar hak milik dan kebebasan berkomunikasi.`, `Vi phạm pháp luật! Tự ý lấy điện thoại có thể xâm phạm quyền sở hữu và quyền liên lạc của bạn.`, `ผิดกฎหมาย! การยึดโทรศัพท์โดยไม่มีเหตุอันชอบธรรมอาจละเมิดสิทธิในทรัพย์สินและการสื่อสาร`, `Ilegal! Maaaring lumabag sa pag-aari at kalayaan mong makipag-ugnayan ang sapilitang pagkuha ng cellphone.`],
        [`Jangan lari saat pemeriksaan polisi. Tunjukkan dokumen atau minta bantuan penerjemah agar situasimu tidak disalahpahami.`, `Không nên bỏ chạy khi cảnh sát kiểm tra. Hãy xuất trình giấy tờ hoặc yêu cầu phiên dịch để tránh hiểu lầm.`, `อย่าวิ่งหนีเมื่อตำรวจตรวจสอบ แสดงเอกสารหรือขอล่ามเพื่อป้องกันความเข้าใจผิด`, `Huwag tumakbo kapag sinusuri ng pulis. Ipakita ang dokumento o humingi ng interpreter upang maiwasan ang hindi pagkakaunawaan.`],
        [`Ilegal! Majikan tidak boleh begitu saja memaksa pekerja pulang; pemutusan kerja harus mengikuti prosedur yang berlaku.`, `Vi phạm pháp luật! Chủ lao động không thể tự ý buộc bạn về nước; việc chấm dứt hợp đồng phải theo đúng thủ tục.`, `ผิดกฎหมาย! นายจ้างไม่อาจบังคับส่งคุณกลับประเทศโดยพลการ การเลิกจ้างต้องทำตามขั้นตอน`, `Ilegal! Hindi basta maaaring pauwiin ka ng amo; dapat sundin ang tamang proseso sa pagwawakas ng trabaho.`],
        [`Legal! Menolak pelecehan dan menghubungi 1955 adalah langkah untuk melindungi diri.`, `Hợp pháp! Từ chối hành vi quấy rối và gọi 1955 là cách để bảo vệ bản thân.`, `ถูกกฎหมาย! การปฏิเสธการคุกคามและโทร 1955 เป็นวิธีปกป้องตนเอง`, `Legal! Makabubuting tumanggi sa harassment at tumawag sa 1955 upang maprotektahan ang sarili.`],
        [`Ilegal! Pekerja berhak atas kebebasan beragama; mintalah penyesuaian yang wajar dan hubungi 1955 bila perlu.`, `Vi phạm pháp luật! Người lao động có quyền tự do tín ngưỡng; hãy đề nghị sắp xếp phù hợp và gọi 1955 nếu cần.`, `ผิดกฎหมาย! ลูกจ้างมีเสรีภาพในการนับถือศาสนา ขอการจัดเวลาที่เหมาะสมและโทร 1955 หากจำเป็น`, `Ilegal! May kalayaan sa relihiyon ang manggagawa; humiling ng makatuwirang oras at tumawag sa 1955 kung kailangan.`],
        [`Ilegal! Majikan harus menghormati kebutuhan agama dan makanan; minta pilihan yang sesuai dan hubungi 1955 bila perlu.`, `Vi phạm pháp luật! Chủ lao động cần tôn trọng yêu cầu về tôn giáo và ăn uống; hãy đề nghị lựa chọn phù hợp hoặc gọi 1955.`, `ผิดกฎหมาย! นายจ้างควรเคารพข้อจำกัดด้านศาสนาและอาหาร ขออาหารที่เหมาะสมหรือโทร 1955`, `Ilegal! Dapat igalang ng amo ang paniniwala at pagkain mo; humingi ng angkop na pagkain o tumawag sa 1955.`],
        [`Legal! Mediasi di kantor tenaga kerja setempat adalah salah satu cara resmi untuk menyelesaikan perselisihan kerja.`, `Hợp pháp! Hòa giải tại cơ quan lao động địa phương là một cách chính thức để giải quyết tranh chấp lao động.`, `ถูกกฎหมาย! การยื่นขอไกล่เกลี่ยที่สำนักงานแรงงานท้องถิ่นเป็นช่องทางทางการในการแก้ข้อพิพาท`, `Legal! Pormal na paraan ang paghingi ng mediation sa lokal na labor office upang lutasin ang alitan sa trabaho.`],
        [`Ilegal! Jam kerja dan lembur memiliki batas. Periksa aturan yang berlaku untuk pekerjaanmu dan hubungi 1955 jika dipaksa bekerja berlebihan.`, `Vi phạm pháp luật! Thời giờ làm việc và tăng ca có giới hạn. Hãy kiểm tra quy định áp dụng và gọi 1955 nếu bị ép làm quá giờ.`, `ผิดกฎหมาย! ชั่วโมงทำงานและล่วงเวลามีขีดจำกัด ตรวจสอบกฎที่ใช้กับงานของคุณและโทร 1955 หากถูกบังคับทำงานเกิน`, `Ilegal! May limit ang oras ng trabaho at overtime. Tingnan ang patakaran para sa trabaho mo at tumawag sa 1955 kung pinagtatrabaho nang sobra.`],
        [`Lembur pada hari istirahat dapat mengikuti aturan persetujuan dan upah yang berlaku. Periksa rincian gaji dan aturan terbaru.`, `Tăng ca vào ngày nghỉ phải tuân theo quy định về sự đồng ý và tiền lương. Hãy kiểm tra bảng lương và quy định mới nhất.`, `การทำงานล่วงเวลาในวันหยุดต้องเป็นไปตามกฎเรื่องความยินยอมและค่าจ้าง ตรวจสอบรายละเอียดเงินเดือนและกฎล่าสุด`, `Dapat sumunod sa patakaran sa pahintulot at bayad ang overtime sa araw ng pahinga. Tingnan ang payslip at pinakabagong tuntunin.`],
        [`Kecelakaan kerja harus segera dilaporkan dan mendapatkan perawatan. Hak pembayaran biaya medis bergantung pada kasus; simpan bukti dan hubungi 1955.`, `Hãy báo ngay tai nạn lao động và đi điều trị. Quyền thanh toán chi phí y tế tùy từng trường hợp; hãy giữ chứng từ và gọi 1955.`, `รีบรายงานอุบัติเหตุจากงานและรับการรักษา สิทธิค่ารักษาขึ้นอยู่กับกรณี เก็บหลักฐานและโทร 1955`, `Ireport agad ang aksidente sa trabaho at magpagamot. Depende sa kaso ang bayad sa medical expenses; itago ang mga resibo at tumawag sa 1955.`],
        [`Ilegal dan berbahaya! Pemberi kerja harus menyediakan perlindungan keselamatan yang diperlukan. Hentikan pekerjaan berbahaya dan laporkan.`, `Vi phạm và nguy hiểm! Chủ lao động phải cung cấp thiết bị bảo hộ cần thiết. Hãy dừng việc nguy hiểm và báo cáo.`, `ผิดกฎหมายและอันตราย! นายจ้างต้องจัดหาอุปกรณ์ป้องกันที่จำเป็น หยุดทำงานเสี่ยงและแจ้งผู้เกี่ยวข้อง`, `Ilegal at mapanganib! Dapat magbigay ang amo ng kailangang safety equipment. Itigil ang mapanganib na trabaho at ireport ito.`],
        [`Legal! Pekerja berhak atas hari istirahat sesuai jadwal dan peraturan kerja yang berlaku.`, `Hợp pháp! Người lao động có quyền nghỉ theo lịch và quy định lao động hiện hành.`, `ถูกกฎหมาย! ลูกจ้างมีสิทธิวันหยุดพักตามตารางและกฎแรงงานที่ใช้บังคับ`, `Legal! May karapatan ang manggagawa sa mga araw ng pahinga ayon sa iskedyul at batas.`],
        [`Ilegal! Pekerja hanya boleh melakukan pekerjaan yang diizinkan dalam izin kerjanya. Tanyakan kepada otoritas atau hotline 1955.`, `Vi phạm pháp luật! Người lao động chỉ được làm công việc được phép trong giấy phép lao động. Hãy hỏi cơ quan chức năng hoặc gọi 1955.`, `ผิดกฎหมาย! ลูกจ้างทำได้เฉพาะงานที่ได้รับอนุญาตในใบอนุญาตทำงาน สอบถามหน่วยงานหรือโทร 1955`, `Ilegal! Trabahong pinahihintulutan lamang sa work permit ang maaari mong gawin. Magtanong sa awtoridad o tumawag sa 1955.`],
        [`Pengumuman libur topan dan aturan masuk bergantung pada pengumuman pemerintah setempat dan jenis pekerjaan; cek informasi resmi atau hubungi 1955.`, `Thông báo nghỉ bão và quy định đi làm tùy thuộc vào chính quyền địa phương và loại công việc; hãy xem tin chính thức hoặc gọi 1955.`, `ประกาศวันหยุดพายุและการไปทำงานขึ้นอยู่กับประกาศท้องถิ่นและประเภทงาน ตรวจสอบข้อมูลทางการหรือโทร 1955`, `Depende sa lokal na anunsyo at uri ng trabaho ang pagpasok kapag may bagyo; tingnan ang opisyal na impormasyon o tumawag sa 1955.`],
        [`Cuti sakit berbayar bergantung pada aturan dan masa kerja. Beri tahu pemberi kerja dan serahkan bukti medis sesuai ketentuan.`, `Nghỉ ốm hưởng lương tùy thuộc vào quy định và thời gian làm việc. Hãy báo chủ lao động và nộp giấy tờ y tế theo yêu cầu.`, `การลาป่วยโดยได้รับค่าจ้างขึ้นอยู่กับกฎและอายุงาน แจ้งนายจ้างและยื่นเอกสารแพทย์ตามข้อกำหนด`, `Depende sa tuntunin at haba ng trabaho ang bayad na sick leave. Ipaalam ito sa amo at magsumite ng medical certificate kung kailangan.`],
        [`Ilegal! Pekerja dilindungi dari perlakuan tidak adil karena kehamilan. Hubungi hotline 1955 untuk meminta bantuan.`, `Vi phạm pháp luật! Người lao động được bảo vệ khỏi việc bị đối xử bất công vì mang thai. Hãy gọi 1955 để được hỗ trợ.`, `ผิดกฎหมาย! ลูกจ้างได้รับความคุ้มครองจากการปฏิบัติไม่เป็นธรรมเพราะตั้งครรภ์ โทร 1955 เพื่อขอความช่วยเหลือ`, `Ilegal! Protektado ang manggagawa laban sa hindi patas na pagtrato dahil sa pagbubuntis. Tumawag sa 1955 para sa tulong.`],
        [`Ilegal! Pekerja yang sedang menjalani perawatan akibat kecelakaan kerja memiliki perlindungan. Simpan bukti medis dan hubungi 1955.`, `Vi phạm pháp luật! Người lao động đang điều trị tai nạn lao động được bảo vệ. Hãy giữ hồ sơ y tế và gọi 1955.`, `ผิดกฎหมาย! ลูกจ้างที่กำลังรักษาตัวจากอุบัติเหตุงานได้รับความคุ้มครอง เก็บหลักฐานการรักษาและโทร 1955`, `Ilegal! May proteksyon ang manggagawang nagpapagaling mula sa aksidente sa trabaho. Itago ang medical records at tumawag sa 1955.`],
        [`Di Taiwan, kendaraan listrik mini harus memenuhi aturan registrasi dan keselamatan sebelum digunakan di jalan. Periksa ketentuan terbaru.`, `Ở Đài Loan, xe điện hai bánh cỡ nhỏ phải đáp ứng quy định đăng ký và an toàn trước khi lưu thông. Hãy kiểm tra quy định mới nhất.`, `ในไต้หวัน รถไฟฟ้าขนาดเล็กต้องจดทะเบียนและปฏิบัติตามข้อกำหนดความปลอดภัยก่อนใช้บนถนน ตรวจสอบกฎล่าสุด`, `Sa Taiwan, kailangang sumunod sa registration at safety rules ang mini electric vehicle bago gamitin sa kalsada. Tingnan ang pinakabagong tuntunin.`],
        [`Jangan berkendara setelah minum alkohol. Mengemudi dalam keadaan mabuk dapat menimbulkan hukuman pidana dan risiko keselamatan.`, `Không lái xe sau khi uống rượu bia. Lái xe khi say có thể bị xử lý hình sự và gây nguy hiểm.`, `ห้ามขับขี่หลังดื่มแอลกอฮอล์ การเมาแล้วขับอาจมีโทษทางอาญาและเป็นอันตราย`, `Huwag magmaneho pagkatapos uminom. Maaaring humantong sa kasong kriminal at panganib ang drunk driving.`],
        [`Legal! Pisahkan botol plastik dan kardus lalu serahkan kepada layanan daur ulang sesuai aturan setempat.`, `Hợp pháp! Hãy phân loại chai nhựa và thùng giấy rồi giao cho dịch vụ tái chế theo quy định địa phương.`, `ถูกกฎหมาย! แยกขวดพลาสติกและกล่องกระดาษแล้วส่งให้บริการรีไซเคิลตามกฎท้องถิ่น`, `Legal! Ihiwalay ang plastik na bote at karton at ibigay sa recycling service ayon sa lokal na patakaran.`],
        [`Di beberapa wilayah, termasuk Taipei dan New Taipei, sampah umum harus memakai kantong resmi. Periksa aturan kotamu.`, `Ở một số khu vực như Đài Bắc và Tân Bắc, rác thường phải dùng túi chuyên dụng. Hãy kiểm tra quy định nơi bạn ở.`, `บางพื้นที่ เช่น ไทเปและนิวไทเป ต้องใช้ถุงขยะที่กำหนด ตรวจสอบกฎของเมืองที่คุณอยู่`, `Sa ilang lugar gaya ng Taipei at New Taipei, kailangang gumamit ng opisyal na garbage bag. Tingnan ang tuntunin sa lungsod mo.`],
        [`Ilegal! Dilarang makan dan minum di dalam gerbong MRT. Pelanggaran dapat dikenai denda; ikuti aturan transportasi.`, `Vi phạm pháp luật! Không được ăn uống trong toa tàu điện ngầm. Có thể bị phạt; hãy tuân thủ quy định giao thông.`, `ผิดกฎหมาย! ห้ามรับประทานอาหารและเครื่องดื่มในขบวนรถไฟฟ้า อาจถูกปรับ โปรดปฏิบัติตามกฎ`, `Ilegal! Bawal kumain at uminom sa loob ng MRT train car; maaaring pagmultahin. Sundin ang mga tuntunin sa transportasyon.`],
        [`Legal dan aman! Gunakan helm yang memenuhi standar dan patuhi lampu lalu lintas saat berkendara.`, `Hợp pháp và an toàn! Hãy đội mũ bảo hiểm đạt chuẩn và tuân thủ đèn giao thông khi đi xe.`, `ถูกกฎหมายและปลอดภัย! สวมหมวกนิรภัยที่ได้มาตรฐานและปฏิบัติตามสัญญาณไฟจราจร`, `Legal at ligtas! Magsuot ng aprubadong helmet at sumunod sa traffic lights habang nagmamaneho.`],
        [`Ilegal! Dilarang merokok di area dalam ruangan stasiun yang ditetapkan sebagai zona bebas rokok.`, `Vi phạm pháp luật! Không được hút thuốc trong khu vực trong nhà của nhà ga có quy định cấm hút thuốc.`, `ผิดกฎหมาย! ห้ามสูบบุหรี่ในพื้นที่ในอาคารของสถานีที่กำหนดเป็นเขตปลอดบุหรี่`, `Ilegal! Bawal manigarilyo sa indoor area ng istasyon na itinalagang smoke-free.`],
        [`Ilegal dan berbahaya! Pengendara dan penumpang sepeda motor harus memakai helm sesuai aturan.`, `Vi phạm và nguy hiểm! Người lái và người ngồi sau xe máy phải đội mũ bảo hiểm theo quy định.`, `ผิดกฎหมายและอันตราย! ผู้ขับขี่และผู้โดยสารรถจักรยานยนต์ต้องสวมหมวกนิรภัยตามกฎ`, `Ilegal at mapanganib! Kailangang magsuot ng helmet ang driver at pasahero ng motorsiklo ayon sa batas.`],
        [`Ilegal! Jangan menangkap satwa liar. Laporkan atau hubungi petugas setempat jika menemukan hewan yang membutuhkan bantuan.`, `Vi phạm pháp luật! Không được bắt động vật hoang dã. Hãy báo cơ quan địa phương nếu thấy động vật cần giúp đỡ.`, `ผิดกฎหมาย! ห้ามจับสัตว์ป่า หากพบสัตว์ที่ต้องการความช่วยเหลือให้แจ้งเจ้าหน้าที่ท้องถิ่น`, `Ilegal! Huwag manghuli ng ligaw na hayop. Ireport sa lokal na awtoridad kung may hayop na nangangailangan ng tulong.`],
        [`Legal! Pekerja migran yang memenuhi syarat mengikuti asuransi kesehatan nasional dan dapat berobat dengan kartu kesehatan.`, `Hợp pháp! Lao động di trú đủ điều kiện tham gia bảo hiểm y tế quốc gia và khám chữa bệnh bằng thẻ bảo hiểm.`, `ถูกกฎหมาย! แรงงานข้ามชาติที่มีคุณสมบัติเข้าร่วมประกันสุขภาพแห่งชาติและใช้บัตรรักษาพยาบาลได้`, `Legal! Ang kwalipikadong migrant worker ay sakop ng National Health Insurance at maaaring magpagamot gamit ang health card.`],
        [`Ilegal dan berisiko! Jangan pinjamkan kartu ATM atau rekening. Rekening dapat digunakan untuk penipuan atau pencucian uang dan membuatmu bertanggung jawab.`, `Vi phạm và nguy hiểm! Không cho mượn thẻ ATM hoặc tài khoản. Tài khoản có thể bị dùng để lừa đảo, rửa tiền và khiến bạn chịu trách nhiệm.`, `ผิดกฎหมายและเสี่ยง! อย่าให้ยืมบัตร ATM หรือบัญชี เพราะอาจถูกใช้ฉ้อโกงหรือฟอกเงินและทำให้คุณต้องรับผิด`, `Ilegal at mapanganib! Huwag ipahiram ang ATM card o account; maaari itong gamitin sa scam o money laundering at managot ka.`],
        [`Ilegal! Bekerja di luar izin kerja dapat dikenai denda dan memengaruhi izin tinggal. Periksa izinmu dan hubungi 1955.`, `Vi phạm pháp luật! Làm việc ngoài giấy phép có thể bị phạt và ảnh hưởng đến tình trạng cư trú. Hãy kiểm tra giấy phép và gọi 1955.`, `ผิดกฎหมาย! การทำงานนอกเหนือใบอนุญาตอาจถูกปรับและกระทบสถานะพำนัก ตรวจสอบใบอนุญาตและโทร 1955`, `Ilegal! Maaaring pagmultahin at maapektuhan ang pananatili mo kapag nagtrabaho nang walang pahintulot. Tingnan ang permit at tumawag sa 1955.`],
        [`Legal! Gunakan bank atau layanan resmi untuk mengirim uang ke keluarga agar transaksi dapat dilacak dan lebih aman.`, `Hợp pháp! Hãy dùng ngân hàng hoặc dịch vụ được cấp phép để chuyển tiền về nhà an toàn và có chứng từ.`, `ถูกกฎหมาย! ใช้ธนาคารหรือบริการที่ได้รับอนุญาตในการโอนเงินกลับบ้าน เพื่อให้ปลอดภัยและตรวจสอบได้`, `Legal! Gumamit ng bangko o lisensyadong serbisyo sa pagpapadala ng pera upang ligtas at may record ang transaksyon.`],
        [`Ilegal dan berisiko! Hindari jasa penukaran uang tidak resmi; kamu dapat kehilangan uang dan menghadapi masalah hukum.`, `Vi phạm và rủi ro! Tránh dịch vụ đổi/chuyển tiền không phép vì có thể mất tiền và gặp vấn đề pháp lý.`, `ผิดกฎหมายและเสี่ยง! หลีกเลี่ยงบริการแลกเปลี่ยนเงินนอกระบบ เพราะอาจเสียเงินและมีปัญหาทางกฎหมาย`, `Ilegal at mapanganib! Iwasan ang hindi lisensyadong money transfer dahil maaaring mawala ang pera at magkaroon ng kasong legal.`],
        [`Ilegal dan berbahaya! Jangan mendaftarkan nomor telepon atau akun atas namamu untuk orang lain; nomor itu dapat dipakai untuk kejahatan.`, `Vi phạm và nguy hiểm! Không đăng ký số điện thoại hoặc tài khoản đứng tên bạn cho người khác; chúng có thể bị dùng phạm tội.`, `ผิดกฎหมายและอันตราย! อย่าจดทะเบียนเบอร์โทรศัพท์หรือบัญชีแทนผู้อื่น เพราะอาจถูกนำไปใช้ก่ออาชญากรรม`, `Ilegal at mapanganib! Huwag magparehistro ng SIM o account para sa iba; maaari itong gamitin sa krimen.`],
        [`Ini adalah penipuan asmara yang umum. Jangan mengirim uang; hentikan kontak dan laporkan akun tersebut.`, `Đây là kiểu lừa đảo tình cảm phổ biến. Đừng chuyển tiền; hãy ngừng liên lạc và báo cáo tài khoản.`, `นี่เป็นกลโกงความรักที่พบบ่อย อย่าโอนเงิน หยุดติดต่อและรายงานบัญชีนั้น`, `Karaniwang romance scam ito. Huwag magpadala ng pera; ihinto ang pakikipag-ugnayan at ireport ang account.`],
        [`Benar! Jangan pernah membagikan kata sandi bank. Blokir dan laporkan orang yang meminta informasi rahasia.`, `Đúng! Không bao giờ chia sẻ mật khẩu ngân hàng. Hãy chặn và báo cáo người yêu cầu thông tin bí mật.`, `ถูกต้อง! อย่าเปิดเผยรหัสผ่านธนาคาร บล็อกและรายงานผู้ที่ขอข้อมูลลับ`, `Tama! Huwag ibigay ang bank password. I-block at ireport ang humihingi ng kumpidensyal na impormasyon.`],
        [`Ilegal dan berisiko! Jangan pinjamkan paspor atau dokumen identitas. Dokumenmu dapat disalahgunakan untuk penipuan.`, `Vi phạm và nguy hiểm! Không cho mượn hộ chiếu hoặc giấy tờ tùy thân vì có thể bị dùng để lừa đảo.`, `ผิดกฎหมายและเสี่ยง! อย่าให้ยืมพาสปอร์ตหรือเอกสารประจำตัว เพราะอาจถูกนำไปใช้ฉ้อโกง`, `Ilegal at mapanganib! Huwag ipahiram ang pasaporte o ID dahil maaari itong gamitin sa panloloko.`],
        [`Ancaman dan laporan palsu adalah hal serius. Simpan bukti dengan aman dan hubungi hotline 1955 untuk bantuan.`, `Đe dọa và tố cáo sai sự thật là vấn đề nghiêm trọng. Hãy giữ bằng chứng an toàn và gọi 1955 để được hỗ trợ.`, `การข่มขู่และแจ้งความเท็จเป็นเรื่องร้ายแรง เก็บหลักฐานอย่างปลอดภัยและโทร 1955 เพื่อขอความช่วยเหลือ`, `Mabigat na usapin ang pagbabanta at maling paratang. Itago nang ligtas ang ebidensya at tumawag sa 1955 para sa tulong.`],
        [`Legal jika memenuhi syarat dan ketentuan terbaru. Syarat izin tinggal permanen bergantung pada situasi; konfirmasikan melalui sumber resmi.`, `Có thể hợp pháp nếu đáp ứng điều kiện mới nhất. Điều kiện thường trú tùy từng trường hợp; hãy xác nhận qua nguồn chính thức.`, `อาจทำได้โดยชอบหากมีคุณสมบัติตามเงื่อนไขล่าสุด คุณสมบัติพำนักถาวรขึ้นอยู่กับกรณี โปรดตรวจสอบกับแหล่งทางการ`, `Maaaring legal kung pasok sa pinakabagong kwalipikasyon. Depende sa sitwasyon ang permanent residency; kumpirmahin sa opisyal na sanggunian.`]
    ];

    let tinderScore = 0;
    let tinderAnswerPending = false;

    const TINDER_TOTAL_Q = 10;

    function applyTinderInterfaceText() {
        const text = uiText();
        document.getElementById('tinder-legal-notice').textContent = text.tinderLegalNotice;
        document.getElementById('tinder-score-label').textContent = text.tinderScore;
        document.getElementById('tinder-stamp-legal').textContent = text.tinderLegal;
        document.getElementById('tinder-stamp-illegal').textContent = text.tinderIllegal;
        document.getElementById('tinder-speak-label').setAttribute('aria-label', text.tinderSpeak);
        document.getElementById('tinder-illegal-label').setAttribute('aria-label', text.tinderIllegal);
        document.getElementById('tinder-legal-label').setAttribute('aria-label', text.tinderLegal);
        document.getElementById('tinder-next-label').textContent = text.tinderNext;
        document.getElementById('tinder-result-title').textContent = text.tinderResult;
        document.getElementById('tinder-result-score-prefix').textContent = text.tinderResultPrefix;
        document.getElementById('tinder-result-score-suffix').textContent = text.tinderResultSuffix;
        document.getElementById('tinder-replay-label').textContent = text.tinderReplay;
        document.getElementById('tinder-back-label').textContent = text.tinderBack;

        if (currentTinderAnswerCorrect !== null && !document.getElementById('tinder-feedback-modal').classList.contains('hidden')) {
            document.getElementById('tinder-feedback-title').textContent = currentTinderAnswerCorrect ? text.tinderCorrect : text.tinderIncorrect;
            updateTinderFeedbackTranslation(tinderQuestions[currentTinderIndex]);
        }
        if (!document.getElementById('tinder-result-modal').classList.contains('hidden')) {
            renderTinderResultMessage();
        }
    }

    function startTinderGame() {
        const beginnerQs = shuffled(tinderData.filter(question => question.level === 'beginner')).slice(0, 4);
        const intermediateQs = shuffled(tinderData.filter(question => question.level === 'intermediate')).slice(0, 3);
        const advancedQs = shuffled(tinderData.filter(question => question.level === 'advanced')).slice(0, 3);
        tinderQuestions = [...beginnerQs, ...intermediateQs, ...advancedQs];
        currentTinderIndex = 0;
        tinderScore = 0;
        tinderAnswerPending = false;
        currentTinderAnswerCorrect = null;
        document.getElementById('tinder-feedback-modal').classList.add('hidden');
        document.getElementById('tinder-result-modal').classList.add('hidden');
        updateTinderProgress();
        loadTinderCard();
    }

    function renderTinderQuestionTranslation(question) {
        const questionIndex = tinderData.indexOf(question);
        const questionTranslation = tinderQuestionTranslations[questionIndex];
        const translationElement = document.getElementById('tinder-card-translation');
        translationElement.textContent = (questionTranslation && questionTranslation[currentLang]) || '';
        translationElement.lang = currentLang === 'tl' ? 'fil' : currentLang;
    }

    function loadTinderCard() {
        const question = tinderQuestions[currentTinderIndex];
        if (!question) return;

        const card = document.getElementById('tinder-card');
        card.style.transform = 'translate(0px, 0px) rotate(0deg)';
        card.style.opacity = '1';
        document.getElementById('tinder-stamp-legal').style.opacity = '0';
        document.getElementById('tinder-stamp-illegal').style.opacity = '0';
        document.getElementById('tinder-card-zh').textContent = question.zh;
        document.getElementById('tinder-card-py').textContent = tinderPinyinOverrides[question.zh] || question.py || getGrammarPinyin(question.zh);
        renderTinderQuestionTranslation(question);
        const emojis = ['🤔', '👀', '💬', '📝', '🚨'];
        document.getElementById('tinder-card-icon').textContent = emojis[Math.floor(Math.random() * emojis.length)];
        tinderAnswerPending = false;
        speakTinderQuestion();
    }

    function speakTinderQuestion() {
        const question = tinderQuestions[currentTinderIndex];
        if (question) speakChinese(question.zh);
    }

    function updateTinderFeedbackTranslation(question) {
        if (!question) return;
        const index = tinderData.indexOf(question);
        const languageIndex = { id: 0, vi: 1, th: 2, tl: 3 }[currentLang];
        const translations = tinderPenaltyTranslations[index];
        const translation = languageIndex === undefined || !translations ? '' : translations[languageIndex] || '';
        const translationElement = document.getElementById('tinder-feedback-translation');
        translationElement.textContent = translation;
        translationElement.lang = currentLang === 'tl' ? 'fil' : currentLang;
        document.getElementById('tinder-feedback-translation-label').textContent = uiText().tinderExplanationTranslation;
        translationElement.classList.toggle('hidden', !translation);
    }

    function handleTinderChoice(userChoice) {
        const question = tinderQuestions[currentTinderIndex];
        if (tinderAnswerPending || !question || !['legal', 'illegal'].includes(userChoice)) return;
        tinderAnswerPending = true;
        currentTinderAnswerCorrect = userChoice === question.type;

        const card = document.getElementById('tinder-card');
        if (userChoice === 'legal') {
            document.getElementById('tinder-stamp-legal').style.opacity = '1';
            card.style.transform = 'translate(120%, 20px) rotate(15deg)';
        } else {
            document.getElementById('tinder-stamp-illegal').style.opacity = '1';
            card.style.transform = 'translate(-120%, 20px) rotate(-15deg)';
        }
        card.style.opacity = '0';
        if (currentTinderAnswerCorrect) tinderScore++;
        updateTinderProgress();
        setTimeout(() => showTinderFeedback(currentTinderAnswerCorrect, question), 300);
    }

    function showTinderFeedback(isCorrect, question) {
        const text = uiText();
        const modal = document.getElementById('tinder-feedback-modal');
        const box = document.getElementById('tinder-feedback-box');
        document.getElementById('tinder-feedback-icon').textContent = isCorrect ? '✅' : '❌';
        const title = document.getElementById('tinder-feedback-title');
        title.className = `text-2xl font-black mb-2 ${isCorrect ? 'text-emerald-600' : 'text-red-600'}`;
        title.textContent = isCorrect ? text.tinderCorrect : text.tinderIncorrect;
        box.className = `w-full max-w-sm rounded-3xl p-6 text-center transform scale-100 transition-transform duration-300 shadow-2xl ${isCorrect ? 'bg-emerald-50 dark:bg-slate-800 border-4 border-emerald-400' : 'bg-red-50 dark:bg-slate-800 border-4 border-red-400'}`;
        document.getElementById('tinder-feedback-desc').textContent = question.penalty;
        updateTinderFeedbackTranslation(question);
        modal.classList.remove('hidden');
        speakChinese(question.penalty);
    }

    function nextTinderCard() {
        document.getElementById('tinder-feedback-modal').classList.add('hidden');
        currentTinderIndex++;
        currentTinderAnswerCorrect = null;
        if (currentTinderIndex < TINDER_TOTAL_Q) {
            loadTinderCard();
        } else {
            showTinderResult();
        }
    }

    function updateTinderProgress() {
        document.getElementById('tinder-score').textContent = tinderScore;
        const completed = currentTinderIndex + (tinderAnswerPending ? 1 : 0);
        document.getElementById('tinder-progress').style.width = `${Math.min(completed / TINDER_TOTAL_Q, 1) * 100}%`;
    }

    function renderTinderResultMessage() {
        const text = uiText();
        let message = text.tinderBadgeKeepLearning;
        if (tinderScore >= 9) message = text.tinderBadgeExpert;
        else if (tinderScore >= 6) message = text.tinderBadgeGood;
        document.getElementById('tinder-badge-msg').textContent = message;
    }

    function showTinderResult() {
        document.getElementById('tinder-final-score').textContent = tinderScore;
        renderTinderResultMessage();
        document.getElementById('tinder-result-modal').classList.remove('hidden');
    }

            .replace(/[（(]([^）)]+)[）)]/g, (placeholder, key) => replacements[key] || '這件事')
            .replace(/\s*\+\s*/g, '')
            .replace(/\s*\/\s*/g, '或')
            .replace(/\s+/g, '')
            .replace(/。+/g, '。');

    function applyDynamicGrammar(originalZh, elementId) {
        let speakText = originalZh;
        let displayHtml = escapeHtml(originalZh);
        const replaceMap = [
            { tag: '(動詞)', dict: vocabVerbs },
            { tag: '(名詞)', dict: vocabNouns },
            { tag: '(形容詞)', dict: vocabAdjs },
            { tag: '(地方)', dict: vocabPlaces }
        ];

        replaceMap.forEach(item => {
            while (displayHtml.includes(item.tag)) {
                const word = getRandomWord(item.dict);
                if (!word || !word.zh) break;

                speakText = speakText.replace(item.tag, word.zh);
                const pronunciation = word.py
                    ? ` <span class="text-[10px] text-teal-600 dark:text-teal-400 font-normal">(${escapeHtml(word.py)})</span>`
                    : '';
                const displayWord = `<span class="text-teal-700 font-black bg-teal-100 dark:bg-teal-900/50 px-1.5 py-0.5 rounded shadow-sm">${escapeHtml(word.zh)}${pronunciation}</span>`;
                displayHtml = displayHtml.replace(item.tag, displayWord);
            }
        });

        speakText = speakText.replace(/\s*\+\s*/g, ' ').replace(/[()]/g, '').replace(/\s+/g, ' ').trim();

        const element = document.getElementById(elementId);
        if (element) {
            if (!element.dataset.original) element.dataset.original = element.innerHTML;
            element.innerHTML = displayHtml;
            setTimeout(() => {
                if (element.isConnected && element.innerHTML === displayHtml) {
                    element.innerHTML = element.dataset.original;
                }
            }, 3500);
        }

        return speakText;
    }

    function buildExpandedGameBanks() {
        const words = [...new Map(masterVocab
            .filter(word => word.zh && Array.from(word.zh).length >= 2)
            .map(word => [word.zh, word]))
            .values()]
            .sort((a, b) => b.zh.length - a.zh.length);
        const sentenceSeen = new Set();
        const generatedFill = [];
        const generatedBuild = [];

        sentencesData.forEach((sentence, sentenceIndex) => {
            if (!sentence.zh || sentenceSeen.has(sentence.zh)) return;
            sentenceSeen.add(sentence.zh);

            let chunks = [];
            let unmatched = '';
            let offset = 0;
            while (offset < sentence.zh.length) {
                const match = words.find(word => sentence.zh.startsWith(word.zh, offset));
                if (match) {
                    if (unmatched) chunks.push(unmatched);
                    chunks.push(match.zh);
                    unmatched = '';
                    offset += match.zh.length;
                } else {
                    unmatched += sentence.zh[offset];
                    offset += 1;
                }
            }
            if (unmatched) chunks.push(unmatched);
            if (chunks.length < 2) chunks = Array.from(sentence.zh);
            while (chunks.length > 8) {
                chunks[chunks.length - 2] += chunks.pop();
            }
            if (chunks.join('') === sentence.zh && chunks.length > 1) {
                generatedBuild.push({
                    level: sentence.zh.length > 35 ? 'advanced' : 'intermediate',
                    zh: sentence.zh,
                    blocks: chunks,
                    id: sentence.id,
                    vi: sentence.vi,
                    th: sentence.th,
                    tl: sentence.tl
                });
            }

            const matchedWords = words.filter(word => sentence.zh.includes(word.zh)).slice(0, 2);
            matchedWords.forEach((word, wordIndex) => {
                const wordStart = sentence.zh.indexOf(word.zh);
                const distractors = words
                    .filter(candidate => candidate.zh !== word.zh)
                    .sort((a, b) => {
                        const aSameCategory = a.cat === word.cat ? 1 : 0;
                        const bSameCategory = b.cat === word.cat ? 1 : 0;
                        return bSameCategory - aSameCategory;
                    })
                    .slice(sentenceIndex + wordIndex, sentenceIndex + wordIndex + 12);
                const options = [word.zh];
                for (const distractor of distractors) {
                    if (!options.includes(distractor.zh)) options.push(distractor.zh);
                    if (options.length === 4) break;
                }
                if (options.length === 4) {
                    generatedFill.push({
                        level: sentence.zh.length > 35 ? 'advanced' : 'intermediate',
                        pre: sentence.zh.slice(0, wordStart),
                        blank: word.zh,
                        post: sentence.zh.slice(wordStart + word.zh.length),
                        py: '',
                        options,
                        id: sentence.id,
                        vi: sentence.vi,
                        th: sentence.th,
                        tl: sentence.tl
                    });
                }
            });
        });

        expandedFillGameData = [...fillGameData, ...generatedFill];
        expandedBuildGameData = [
            ...buildGameData,
            ...generatedBuild.filter(question => !buildGameData.some(item => item.zh === question.zh))
        ];
        expandedScenarioGameData = [
            ...scenarioGameData,
            ...advancedReplyGameData.map(question => ({
                type: 'replyContext',
                level: question.level || 'advanced',
                scenarioZh: question.prompt.zh,
                scenarioPy: question.prompt.py,
                id: question.prompt.id,
                vi: question.prompt.vi,
                th: question.prompt.th,
                tl: question.prompt.tl,
                options: question.options
            })),
            ...grammarData.map((grammar, index) => {
                const distractors = grammarData
                    .filter((_, candidateIndex) => candidateIndex !== index)
                    .slice((index * 7) % Math.max(1, grammarData.length - 3), (index * 7) % Math.max(1, grammarData.length - 3) + 3);
                const options = [
                    { zh: materializeGrammarPattern(grammar.zh), py: getGrammarPinyin(materializeGrammarPattern(grammar.zh)), id: grammar.id, vi: grammar.vi, th: grammar.th, tl: grammar.tl, correct: true },
                    ...distractors.map(item => ({
                        zh: materializeGrammarPattern(item.zh),
                        py: getGrammarPinyin(materializeGrammarPattern(item.zh)),
                        id: item.id,
                        vi: item.vi,
                        th: item.th,
                        tl: item.tl,
                        correct: false
                    }))
                ];
                return {
                    type: 'grammar',
                    grammar,
                    options: shuffled(options)
                };
            })
        ];
    }

    function syncGameContentIntoLearningBanks() {
        const normalize = text => String(text || '').replace(/[\s，。！？；：、,.!?;:"'「」『』（）()]/g, '');
        const hanCount = text => Array.from(String(text || '')).filter(char => /[\u3400-\u9fff]/.test(char)).length;
        const hasSentencePunctuation = text => /[。！？!?；;]/.test(String(text || ''));
        advancedFillGameData.forEach(question => {
            question.options.forEach(option => {
                if (!option.py || /[\u3400-\u9fff]/.test(option.py)) option.py = getGamePinyin(option.zh);
            });
        });
        advancedBuildGameData.forEach(question => {
            question.py = getGameOptionPinyin(question.zh, question.py);
            question.blocksPy = question.blocks.map((block, index) =>
                getGameOptionPinyin(block, question.blocksPy[index])
            );
        });
        masterVocab.forEach(item => {
            if (!item.py || /[\u3400-\u9fff]/.test(item.py)) {
                const repairedPinyin = getGamePinyin(item.zh);
                if (repairedPinyin) {
                    item.py = repairedPinyin;
                    item.pyPlain = normalizePinyin(repairedPinyin);
                }
            }
        });
        const existingWords = new Set(masterVocab.map(item => normalize(item.zh)));
        const existingSentences = new Set(sentencesData.map(item => normalize(item.zh)));
        const wordsToAdd = new Map();
        const sentencesToAdd = new Map();
        const translations = (item, keys = ['id', 'vi', 'th', 'tl']) => {
            const result = {};
            keys.forEach(key => {
                if (typeof item?.[key] === 'string') result[key] = item[key];
            });
            return result;
        };
        const categoryFor = (text, fallback = 'life') => {
            if (/雇主|老闆|薪水|薪資|加班|勞工|仲介|勞保|健保|法律|契約|勞動|申訴|違法|合法|護照|居留證|1955|扣款|工資/.test(text)) return 'law';
            if (/頭暈|不舒服|就醫|醫院|藥|健康|受傷|診所|身體/.test(text)) return 'health';
            if (/公車|捷運|地鐵|台北|車站|交通|火車|機車/.test(text)) return 'travel';
            if (/工作|機器|工廠|主管|安全|訂單|品質|檢查|打卡|同事|公司|異音|現場|停止鍵|瑕疵/.test(text)) return 'work';
            return fallback;
        };
        const addCandidate = (store, existing, zh, py, translated, category) => {
            const text = String(zh || '').trim();
            const key = normalize(text);
            if (!key || !/[\u3400-\u9fff]/.test(text) || existing.has(key)) return;
            const entry = store.get(key) || {
                zh: text,
                py: '',
                id: '',
                vi: '',
                th: '',
                tl: '',
                cat: categoryFor(text, category)
            };
            const cleanPinyin = getGameOptionPinyin(text, py);
            if (cleanPinyin) entry.py = cleanPinyin;
            ['id', 'vi', 'th', 'tl'].forEach(language => {
                if (!entry[language] && translated && translated[language]) entry[language] = translated[language];
            });
            store.set(key, entry);
        };
        const addWord = (text, py, translated, category) => {
            const cleanText = String(text || '').trim().replace(/^[，。！？；：、,.!?;:"'「」『』（）()]+|[，。！？；：、,.!?;:"'「」『』（）()]+$/g, '');
            if (hanCount(cleanText) > 20 || /[A-Za-z]/.test(cleanText)) return;
            const key = normalize(cleanText);
            if (!key || existingWords.has(key)) return;
            addCandidate(wordsToAdd, existingWords, cleanText, py, translated || {}, categoryFor(cleanText, category));
        };
        const addSentence = (text, py, translated, category) => {
            addCandidate(sentencesToAdd, existingSentences, text, py, translated, categoryFor(text, category || 'social'));
        };
        const addOption = (option, category) => {
            if (!option || !option.zh) return;
            const translated = translations(option);
            if (hasSentencePunctuation(option.zh) || hanCount(option.zh) > 12) {
                addSentence(option.zh, option.py, translated, category);
            } else {
                addWord(option.zh, option.py, translated, category);
            }
        };
        const addFillQuestion = question => {
            const translated = translations(question);
            addSentence(question.pre + question.blank + question.post, question.py, translated, 'work');
            addWord(question.blank, getGamePinyin(question.blank), {}, 'work');
            question.options.forEach(option => {
                if (typeof option === 'string') addWord(option, '', {}, 'work');
                else addOption(option, 'work');
            });
        };
        const addBuildQuestion = question => {
            addSentence(question.zh, question.py, translations(question), 'work');
            question.blocks.forEach((block, index) => addWord(block, question.blocksPy?.[index], {}, 'work'));
        };

        [...expandedFillGameData, ...advancedFillGameData].forEach(addFillQuestion);
        [...expandedBuildGameData, ...advancedBuildGameData].forEach(addBuildQuestion);
        [...expandedScenarioGameData, ...scenarioGameData].forEach(question => {
            if (question.type === 'grammar') {
                question.options.forEach(option => addOption(option, 'work'));
                return;
            }
            addSentence(question.scenarioZh, question.scenarioPy, translations(question), 'work');
            question.options.forEach(option => addOption(option, 'work'));
        });
        [...replyGameData, ...advancedReplyGameData].forEach(question => {
            addSentence(question.prompt.zh, question.prompt.py, translations(question.prompt), 'work');
            question.options.forEach(option => addOption(option, 'work'));
            if (question.learning?.word) addWord(question.learning.word, getGamePinyin(question.learning.word), {}, 'work');
            if (question.learning?.sentence) {
                const chineseSentence = question.learning.sentence.replace(/\s*[\(（][^()（）]*[)）]\s*/g, '').trim();
                addSentence(chineseSentence, getGamePinyin(chineseSentence), {}, 'law');
            }
        });
        tinderData.forEach((question, index) => {
            addSentence(question.zh, question.py, {}, 'law');
            const penaltyTranslations = tinderPenaltyTranslations[index] || [];
            addSentence(question.penalty, '', {
                id: penaltyTranslations[0] || '',
                vi: penaltyTranslations[1] || '',
                th: penaltyTranslations[2] || '',
                tl: penaltyTranslations[3] || ''
            }, 'law');
        });

        wordsToAdd.forEach(item => {
            if (!item.py) return;
            item.idx = masterVocab.length;
            item.pyPlain = normalizePinyin(item.py);
            masterVocab.push(item);
            existingWords.add(normalize(item.zh));
        });
        sentencesToAdd.forEach(item => {
            if (!item.py || !['id', 'vi', 'th', 'tl'].every(language =>
                typeof item[language] === 'string' && item[language].trim()
            )) return;
            item.idx = sentencesData.length;
            sentencesData.push(item);
            existingSentences.add(normalize(item.zh));
        });
        updateCategoryCounts();
        renderSentenceCategories();
    }

    function nextQuestionByLevel(questionBank, cycle) {
        const availableLevels = ['beginner', 'intermediate', 'advanced']
            .filter(level => questionBank.some(question => (question.level || 'intermediate') === level));
        if (!availableLevels.length) return questionBank[Math.floor(Math.random() * questionBank.length)] || null;

        if (cycle.index >= cycle.order.length) {
            cycle.order = shuffled(availableLevels);
            if (cycle.order.length > 1 && cycle.order[0] === cycle.lastLevel) {
                const differentLevelIndex = cycle.order.findIndex(level => level !== cycle.lastLevel);
                [cycle.order[0], cycle.order[differentLevelIndex]] = [cycle.order[differentLevelIndex], cycle.order[0]];
            }
            cycle.index = 0;
        }
        const level = cycle.order[cycle.index++];
        const questionsAtLevel = questionBank.filter(question => (question.level || 'intermediate') === level);
        const alternatives = questionsAtLevel.filter(question => question !== cycle.lastQuestion);
        const pool = alternatives.length ? alternatives : questionsAtLevel;
        const question = pool[Math.floor(Math.random() * pool.length)];
        cycle.lastQuestion = question;
        cycle.lastLevel = level;
        return question;
    }

    function resetAndRenderDict() {
        visibleCount = PAGE_SIZE;

    function loadMore() {
        visibleCount += PAGE_SIZE;

    function renderDictItems() {
        const rawQ = document.getElementById('dict-search').value || '';
        const q = rawQ.trim().toLowerCase();
        const qPlain = normalizePinyin(q);

        const clearBtn = document.getElementById('clear-search-btn');
        if (q.length > 0) clearBtn.classList.remove('hidden');
        else clearBtn.classList.add('hidden');

        const filtered = masterVocab.filter(w => {
            if (currentDictCat !== 'all' && w.cat !== currentDictCat) return false;
            if (!q) return true;
            return w.zh.toLowerCase().includes(q) ||
                   w.py.toLowerCase().includes(q) ||
                   w.pyPlain.includes(qPlain) ||
                   (w[currentLang] && w[currentLang].toLowerCase().includes(q));
        });

        const listEl = document.getElementById('dict-list');
        const loadBtn = document.getElementById('load-more-container');
        const itemsToShow = filtered.slice(0, visibleCount);
        
        if (itemsToShow.length === 0) {
            listEl.innerHTML = `<div class="p-8 text-center text-gray-400 text-sm">${uiText().noResults.replace('{query}', escapeHtml(rawQ))}</div>`;
            loadBtn.classList.add('hidden');
            return;
        }

        listEl.innerHTML = itemsToShow.map(w => `
            <div class="flex items-center justify-between bg-white dark:bg-slate-800 px-4 py-3 active:bg-gray-100 dark:active:bg-slate-700 cursor-pointer transition" onclick="speakVocab(${w.idx})">
                <div class="flex-1 pr-3">
                    <div class="text-2xl font-black text-slate-900 dark:text-white mb-1">${w.zh}</div>
                    <div class="text-sm font-bold text-teal-700 dark:text-teal-400">
                        ${w[currentLang] || ''} 
                        <span class="text-xs font-normal text-gray-400 ml-2 block sm:inline mt-0.5 sm:mt-0">${w.py}</span>
                    </div>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                    <button class="w-10 h-10 flex items-center justify-center bg-amber-50 dark:bg-slate-700 border border-amber-200 dark:border-slate-600 rounded-full text-amber-500 shadow-sm active:scale-95" onclick="event.stopPropagation(); toggleFavorite('vocab', ${w.idx})" aria-label="${escapeHtml(isFavorite('vocab', w.idx) ? uiText().favoriteRemove : uiText().favoriteAdd)}" title="${escapeHtml(isFavorite('vocab', w.idx) ? uiText().favoriteRemove : uiText().favoriteAdd)}"><i class="fa-${isFavorite('vocab', w.idx) ? 'solid' : 'regular'} fa-star"></i></button>
                    <button class="w-12 h-12 flex items-center justify-center bg-gray-50 dark:bg-slate-700 border border-gray-200 dark:border-slate-600 rounded-full text-xl shadow-sm active:scale-95" onclick="event.stopPropagation(); openVocabCard(${w.idx})">📢</button>
                </div>
            </div>
        `).join('');

        if (visibleCount < filtered.length) {
            loadBtn.classList.remove('hidden');
            loadBtn.querySelector('button').innerText = `${uiText().showMore.replace('{shown}', itemsToShow.length).replace('{total}', filtered.length)}`;
        } else {
            loadBtn.classList.add('hidden');
        }
    }

    // 聽力測驗邏輯
    let currentQuizChoices = [];
    function startSimpleQuiz() {
        document.getElementById('quiz-area').classList.remove('hidden');
        nextQuiz();
    }

    function nextQuiz() {
        const fb = document.getElementById('quiz-feedback');
        fb.classList.add('hidden');
        currentQuizResult = null;
        document.getElementById('quiz-zh-hint').classList.add('blur-sm');

        const contextQuestions = advancedReplyGameData
            .map(question => question.prompt)
            .filter(prompt => prompt.zh && prompt[currentLang]);
        if (contextQuestions.length < 4) return;
        currentQuizWord = contextQuestions[Math.floor(Math.random() * contextQuestions.length)];
        document.getElementById('quiz-zh-hint').innerText = currentQuizWord.zh;
        document.getElementById('quiz-py-hint').innerText = currentQuizWord.py;
        
        currentQuizChoices = [currentQuizWord];
        const targetCharacters = new Set(Array.from(currentQuizWord.zh).filter(char => /[\u3400-\u9fff]/.test(char)));
        const similarContexts = contextQuestions
            .filter(candidate => candidate !== currentQuizWord)
            .map(candidate => {
                const candidateCharacters = new Set(Array.from(candidate.zh).filter(char => /[\u3400-\u9fff]/.test(char)));
                const overlap = [...targetCharacters].filter(char => candidateCharacters.has(char)).length;
                const lengthDifference = Math.abs(candidate.zh.length - currentQuizWord.zh.length);
                return { candidate, score: overlap * 2 - lengthDifference * 0.1 };
            })
            .sort((left, right) => right.score - left.score)
            .slice(0, 8)
            .map(item => item.candidate);
        currentQuizChoices.push(...shuffled(similarContexts).slice(0, 3));
        currentQuizChoices.sort(() => Math.random() - 0.5);
        renderQuizOptions();
        speakQuizWord();
    }

    function renderQuizOptions() {
        if (!currentQuizWord) return;
        document.getElementById('quiz-options').innerHTML = currentQuizChoices.map(c => `
            <button onclick="checkQuiz(${c === currentQuizWord})" class="min-h-[52px] bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700 p-3 rounded-xl text-left font-bold text-gray-800 dark:text-gray-100 shadow-sm active:bg-teal-50 dark:active:bg-slate-700">
                ${escapeHtml(c[currentLang] || c.id || '')}
            </button>
        `).join('');
    }

    function speakQuizWord() {
        if (currentQuizWord) speakChinese(currentQuizWord.zh);
    }

    function checkQuiz(isCorrect) {
        currentQuizResult = isCorrect;
        document.getElementById('quiz-zh-hint').classList.remove('blur-sm');
        renderQuizFeedback();

        if (isCorrect) {
            setTimeout(nextQuiz, 1400);
        } else {
            speakQuizWord();
        }
    }
    function renderQuizFeedback() {
        if (currentQuizResult === null) return;
        const fb = document.getElementById('quiz-feedback');
        fb.className = currentQuizResult
            ? 'p-3 rounded-xl text-center text-sm font-bold bg-emerald-100 text-emerald-800'
            : 'p-3 rounded-xl text-center text-sm font-bold bg-red-100 text-red-800';
        fb.innerText = currentQuizResult
            ? `${uiText().correct} (${currentQuizWord.zh} - ${currentQuizWord.py})`
            : uiText().wrong;
        fb.classList.remove('hidden');
    }

            py: w.py,
            translation: w[currentLang] || w.id || ''
        }));
        return [...sentencePool, ...vocabPool];
    }

    function nextSpeakGame() {
        stopActiveSpeechRecognition();
        const pool = getSpeakPracticePool();
        if (pool.length === 0) return;
        const candidates = pool.filter(item => !currentSpeakItem || item.zh !== currentSpeakItem.zh);
        currentSpeakItem = candidates[Math.floor(Math.random() * candidates.length)] || pool[0];
        const resBox = document.getElementById('speak-game-result');
        if (resBox) resBox.classList.add('hidden');

    function cleanSpeechChars(str) {
        return String(str || '').replace(/[^\u3400-\u9fffA-Za-z0-9]/g, '').toLowerCase();
    }

    function computeLevenshteinSimilarity(a, b) {
        if (!a && !b) return 1;
        if (!a || !b) return 0;
        const m = a.length;
        const n = b.length;
        const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
        for (let i = 0; i <= m; i++) dp[i][0] = i;
        for (let j = 0; j <= n; j++) dp[0][j] = j;
        for (let i = 1; i <= m; i++) {
            for (let j = 1; j <= n; j++) {
                const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                dp[i][j] = Math.min(
                    dp[i - 1][j] + 1,
                    dp[i][j - 1] + 1,
                    dp[i - 1][j - 1] + cost
                );
            }
        }
        const maxLen = Math.max(m, n);
        return maxLen === 0 ? 1 : (maxLen - dp[m][n]) / maxLen;
    }

    function speechSimilarity(targetZh, spokenTranscript) {
        const cleanTarget = cleanSpeechChars(targetZh);
        const cleanSpoken = cleanSpeechChars(spokenTranscript);
        if (!cleanTarget || !cleanSpoken) return 0;
        if (cleanSpoken === cleanTarget || cleanSpoken.includes(cleanTarget)) return 1;
        const charSim = computeLevenshteinSimilarity(cleanTarget, cleanSpoken);
        const targetPy = normalizePinyin(getGamePinyin(cleanTarget) || cleanTarget).replace(/\s+/g, '');
        const spokenPy = normalizePinyin(getGamePinyin(cleanSpoken) || cleanSpoken).replace(/\s+/g, '');
        return Math.max(charSim, computeLevenshteinSimilarity(targetPy, spokenPy));
    }

    function evaluateSpeechStars(targetZh, spokenTranscript) {
        if (!cleanSpeechChars(spokenTranscript)) return 1;
        const score = speechSimilarity(targetZh, spokenTranscript);
        return score >= 0.78 ? 3 : score >= 0.42 ? 2 : 1;
    }

    const speechCharKeyCache = new Map();
    function speechCharKey(ch) {
        if (speechCharKeyCache.has(ch)) return speechCharKeyCache.get(ch);
        let key = '';
        try { key = normalizePinyin(getGamePinyin(ch) || '').replace(/\s+/g, ''); } catch (e) { key = ''; }
        speechCharKeyCache.set(ch, key);
        return key;
    }

    // 逐字比對: ok = 字相同, near = 字不同但拼音(不計聲調)相同, miss = 沒唸到或唸錯, pun = 標點
    function alignSpeechChars(targetZh, spokenTranscript) {
        const isHan = ch => /[\u3400-\u9fff]/.test(ch);
        const isScored = ch => /[\u3400-\u9fffA-Za-z0-9]/.test(ch);
        const targetChars = Array.from(String(targetZh || ''));
        const A = targetChars.filter(isScored).map(ch => ch.toLowerCase());
        const B = Array.from(cleanSpeechChars(spokenTranscript)).slice(0, 200);
        const weight = (a, b) => {
            if (a === b) return 2;
            if (!isHan(a) || !isHan(b)) return 0;
            const key = speechCharKey(a);
            return key && key === speechCharKey(b) ? 1 : 0;
        };
        const dp = Array.from({ length: A.length + 1 }, () => new Array(B.length + 1).fill(0));
        for (let i = 1; i <= A.length; i++) {
            for (let j = 1; j <= B.length; j++) {
                const w = weight(A[i - 1], B[j - 1]);
                dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1], w ? dp[i - 1][j - 1] + w : 0);
            }
        }
        const states = new Array(A.length).fill('miss');
        let i = A.length, j = B.length;
        while (i > 0 && j > 0) {
            const w = weight(A[i - 1], B[j - 1]);
            if (w && dp[i][j] === dp[i - 1][j - 1] + w) { states[i - 1] = w === 2 ? 'ok' : 'near'; i--; j--; }
            else if (dp[i - 1][j] >= dp[i][j - 1]) i--;
            else j--;
        }
        let k = 0;
        return targetChars.map(ch => isScored(ch) ? { ch, state: states[k++] } : { ch, state: 'pun' });
    }

    function analyzeSpeech(targetZh, spokenTranscript) {
        const stars = evaluateSpeechStars(targetZh, spokenTranscript);
        const marks = alignSpeechChars(targetZh, spokenTranscript);
        const scored = marks.filter(m => m.state !== 'pun');
        const allExact = scored.length > 0 && scored.every(m => m.state === 'ok');
        const level = stars === 3 ? (allExact ? 'perfect' : 'good') : stars === 2 ? 'close' : 'retry';
        return { transcript: spokenTranscript, stars, marks, level, percent: Math.round(speechSimilarity(targetZh, spokenTranscript) * 100) };
    }

    // graceful=true:已拿到結果,用 stop() 讓辨識自然結束;其餘(取消、換題、關閉)用 abort()
    function stopActiveSpeechRecognition(graceful) {

        if (code === 'no-speech') return 'noSpeech';
        if (code === 'audio-capture') return 'noMic';

        if (code === 'language-not-supported') return 'lang';
        return 'generic';
    }

    function showSpeechProblem(context, message) {
        clearSpeechResultUi(context);
        if (context === 'game') {
            const box = document.getElementById('speak-game-result');
            if (box) box.classList.add('hidden');
            const status = document.getElementById('speak-game-status');
            if (status) status.textContent = message;
        } else if (context === 'modal') {
            const box = document.getElementById('modal-speech-box');
            if (box) box.classList.remove('hidden');
            document.getElementById('modal-speech-stars').textContent = '⚠️';
            document.getElementById('modal-speech-msg').textContent = message;
            document.getElementById('modal-speech-transcript').textContent = '';
        }
    }

    function triggerSpeechAssessment(context, isRetry, waited) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const t = extraText();
        if (isSpeechListening) {
            stopActiveSpeechRecognition();
            return;
        }
        if (window.isSecureContext === false) {
            showSpeechProblem(context, speechMsg('insecure'));
            return;
        }
        if (!SpeechRecognition) {
            showSpeechProblem(context, speechMsg('unsupported'));
            return;
        }

        const targetText = context === 'modal'
            ? currentModalZh
            : (currentSpeakItem ? currentSpeakItem.zh : '');
        if (!targetText) return;

        // 取消還沒開始播的示範發音;若示範發音或上一次辨識還沒完全結束,先等 0.35 秒讓麥克風釋放
        chineseSpeechRequestId++;
        clearTimeout(chineseSpeechTimer);
        clearTimeout(chineseSpeechWatchdog);
        const synth = 'speechSynthesis' in window ? window.speechSynthesis : null;
        const needsWait = !!speechSessionInFlight || !!(synth && (synth.speaking || synth.pending));
        if (synth) synth.cancel();
        if (needsWait && !waited) {
            const token = ++speechStartToken;
            if (speechSessionInFlight) { try { speechSessionInFlight.abort(); } catch (e) {} }
            setTimeout(() => { if (token === speechStartToken) triggerSpeechAssessment(context, isRetry, true); }, 350);
            return;
        }

        const recognition = new SpeechRecognition();
        activeRecognition = recognition;
        speechSessionInFlight = recognition;
        activeSpeechContext = context;
        isSpeechListening = true;
        const isStale = () => recognition !== activeRecognition;

        recognition.lang = 'zh-TW';
        recognition.continuous = false;
        recognition.interimResults = true;   // 邊講邊顯示辨識到的字
        recognition.maxAlternatives = 3;

        const micBtn = document.getElementById(context === 'modal' ? 'modal-mic-btn' : 'speak-game-mic-btn');
        if (micBtn) micBtn.classList.add('mic-listening');

        clearSpeechResultUi(context);
        if (context === 'game') {
            document.getElementById('speak-game-result').classList.add('hidden');
            document.getElementById('speak-game-status').textContent = t.speakListening;
        } else {
            document.getElementById('modal-speech-box').classList.remove('hidden');
            document.getElementById('modal-speech-stars').textContent = '🎙️';
            document.getElementById('modal-speech-msg').textContent = t.speakListening;
            document.getElementById('modal-speech-transcript').textContent = '';
        }

        let handledResult = false;
        let lastHeard = '';
        const showLive = text => {
            const line = `${verdictText('live')}：${text}`;
            const el = document.getElementById(context === 'modal' ? 'modal-speech-transcript' : 'speak-game-status');
            if (el) el.textContent = line;
        };
        // 取最佳候選並顯示結果;最終結果沒來時,改用最後一次即時辨識的文字
        const finish = candidates => {
            if (handledResult) return;
            handledResult = true;
            let best = null;
            candidates.filter(Boolean).forEach(candidate => {
                const analysis = analyzeSpeech(targetText, candidate);
                if (!best || analysis.stars > best.stars || (analysis.stars === best.stars && analysis.percent > best.percent)) best = analysis;
            });
            stopActiveSpeechRecognition(true);
            renderSpeechRatingOutput(context, best || analyzeSpeech(targetText, ''));
        };

        recognition.onresult = event => {
            if (isStale() || !event.results || !event.results.length) return;
            const last = event.results[event.results.length - 1];
            const alternatives = Array.from(last, alt => alt.transcript);
            if (last.isFinal !== false) {
                finish(alternatives);
            } else if (alternatives[0]) {
                lastHeard = alternatives[0];
                showLive(lastHeard);
            }
        };
        // 講完就主動結束,避免部分手機一直等到逾時才給結果
        recognition.onspeechend = () => {
            if (!isStale()) { try { recognition.stop(); } catch (e) {} }
        };

        recognition.onerror = event => {
            if (isStale()) return;
            const code = event && event.error;
            console.warn('SpeechRecognition error:', code);
            const fatal = ['not-allowed', 'service-not-allowed', 'audio-capture', 'language-not-supported'].includes(code);
            if (lastHeard && !fatal && code !== 'aborted') { finish([lastHeard]); return; }
            stopActiveSpeechRecognition();
            if (code === 'aborted') return;
            showSpeechProblem(context, speechMsg(speechErrorKey(code)));
        };

        const startedAt = Date.now();
        recognition.onend = () => {
            if (speechSessionInFlight === recognition) speechSessionInFlight = null;
            if (isStale() || handledResult) return;
            if (lastHeard) { finish([lastHeard]); return; }
            stopActiveSpeechRecognition();
            // 一啟動就結束、完全沒聽到聲音:多半是麥克風還沒釋放,自動重試一次
            if (!isRetry && Date.now() - startedAt < 1000) {
                const token = speechStartToken;
                setTimeout(() => { if (token === speechStartToken) triggerSpeechAssessment(context, true, true); }, 400);
                return;
            }
            showSpeechProblem(context, t.speakNoMatch);
        };

        try {
            recognition.start();
            speechMaxTimer = setTimeout(() => {
                if (!isStale()) { try { recognition.stop(); } catch (e) {} }
            }, 12000);
        } catch (err) {
            console.warn('SpeechRecognition start failed:', err);
            stopActiveSpeechRecognition();
            showSpeechProblem(context, speechMsg('generic'));
        }
    }

    let chineseSpeechWatchdog = null;

    function speakChinese(text) {
        if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') {
            showChineseSpeechNotice();
            return;
        }

        const speechText = String(text || '').trim();
        if (!speechText) return;

        const speechRate = speechText === lastChineseSpeechText ? 0.65 : 0.85;
        lastChineseSpeechText = speechText;
        const synthesis = window.speechSynthesis;
        const requestId = ++chineseSpeechRequestId;
        clearTimeout(chineseSpeechTimer);
        clearTimeout(chineseSpeechWatchdog);
        synthesis.cancel();
        synthesis.resume();

        chineseSpeechTimer = setTimeout(() => {
            if (requestId !== chineseSpeechRequestId) return;

            const voices = synthesis.getVoices();
            const voice = voices.find(item => /^zh[-_]TW$/i.test(item.lang))
                || voices.find(item => /^zh[-_]Hant/i.test(item.lang))
                || voices.find(item => /^zh[-_]CN$/i.test(item.lang))
                || voices.find(item => /^zh/i.test(item.lang));
            const utterance = new SpeechSynthesisUtterance(speechText);
            utterance.lang = voice ? voice.lang : 'zh-TW';
            utterance.rate = speechRate;
            if (voice) utterance.voice = voice;

            let started = false;
            utterance.onstart = () => {
                started = true;
                if (requestId === chineseSpeechRequestId) {
                    const notice = document.getElementById('speech-status');
                    if (notice) notice.classList.add('hidden');
                }
            };
            utterance.onerror = event => {
                if (requestId === chineseSpeechRequestId && event.error !== 'canceled' && event.error !== 'interrupted') {
                    showChineseSpeechNotice();
                }
            };

            try {
                synthesis.speak(utterance);
            } catch (error) {
                if (requestId === chineseSpeechRequestId) showChineseSpeechNotice();
                return;
            }

            // 有些 Android 語音引擎在沒有中文語音包時「不報錯也不出聲」,
            // 2.5 秒內沒開始播放就主動提示使用者去下載中文(台灣)語音
            chineseSpeechWatchdog = setTimeout(() => {
                if (requestId === chineseSpeechRequestId && !started && !synthesis.speaking) {
                    showChineseSpeechNotice();
                }
            }, 2500);
        }, 120);
    }

    let offlineWorkerReady = false;

    function updateOfflineStatus(unavailable = false) {
        const status = document.getElementById('offline-status');
        if (!status) return;

        if (unavailable) {
            status.textContent = uiText().offlineUnavailable;
        } else if (!navigator.onLine) {
            status.textContent = uiText().offlineNow;
        } else if (navigator.serviceWorker && (navigator.serviceWorker.controller || offlineWorkerReady)) {
            status.textContent = uiText().offlineReady;
        } else {
            status.textContent = uiText().offlinePreparing;
        }
        status.classList.remove('hidden');
    }

    function registerOfflineSupport() {
        if (!('serviceWorker' in navigator) || !/^https?:$/.test(window.location.protocol)) {
            updateOfflineStatus(true);
            return;
        }

        updateOfflineStatus();
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            offlineWorkerReady = true;
            updateOfflineStatus();
        });
        window.addEventListener('online', () => updateOfflineStatus());
        window.addEventListener('offline', () => updateOfflineStatus());
        navigator.serviceWorker.register('./sw.js')
            .then(registration => navigator.serviceWorker.ready)
            .then(() => {
                offlineWorkerReady = true;
                updateOfflineStatus();
            })
            .catch(error => {
                console.error('Offline support could not be initialized:', error);
                updateOfflineStatus(true);
            });
    }

    parseRawData();
    buildExpandedGameBanks();
    syncGameContentIntoLearningBanks();
    buildPOSDictionary();
    if ('speechSynthesis' in window) {
        window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }
    setLang(currentLang);
    registerOfflineSupport();
</script>
